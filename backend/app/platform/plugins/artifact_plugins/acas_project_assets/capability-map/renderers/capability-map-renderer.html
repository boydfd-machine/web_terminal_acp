      function compareNames(o){const out={};function addSide(side){arr(side&&side.zones).forEach(z=>arr(z.capabilities).forEach(c=>{if(c.capabilityId)out[c.capabilityId]=text(c.name||c.capabilityId);arr(c.children).forEach(ch=>{if(ch.capabilityId)out[ch.capabilityId]=text(ch.name||ch.capabilityId)})}))}addSide(o.compareMap&&o.compareMap.before);addSide(o.compareMap&&o.compareMap.after);arr(o.proposedChanges).forEach(c=>{if(c.targetCapabilityId&&!out[c.targetCapabilityId])out[c.targetCapabilityId]=c.targetCapabilityId;if(c.proposedCapability&&c.proposedCapability.capabilityId)out[c.proposedCapability.capabilityId]=text(c.proposedCapability.name||c.proposedCapability.capabilityId)});return out}

      function questions(items,option){const names=compareNames(option||{});const qs=arr(items).map(q=>'<div class="card"><h3>'+esc(text(q.question))+'</h3><p class="muted">'+esc(text(q.whyItMatters||q.recommendationReason||q.defaultRecommendation))+'</p><div class="question-options">'+arr(q.options).map(o=>questionOption(o,q.recommendedOptionId,names)).join('')+'</div></div>').join('');return qs||'<div class="empty">'+esc(tr('noClarificationQuestions'))+'</div>'}

      function currentView(d){const map=currentModel(d);const caps=arr(map.capabilities);const tree=map.layoutModel&&map.layoutModel.layoutTree;if(!S.detailTab)S.detailTab='overview';if(!S.mapDensity)S.mapDensity='full';if(!S.mapView)S.mapView='diagram';const title=map.title||map.mapId||'能力地图 Current';const meta=chip('layer',d.layer||'Current',true)+chip('map',map.mapId)+chip('sourceJourney',d.sourceJourneyRef)+chip('decision',d.decisionTrace&&d.decisionTrace.selectedOptionId);const diagramLabel=S.lang==='en'?'Diagram':'架构图';const listLabel=S.lang==='en'?'List':'列表';const simpleLabel=S.lang==='en'?'Simple':'精简';const fullLabel=S.lang==='en'?'Detailed':'复杂';const tabs='<div class="view-tabs"><button class="'+(S.mapView==='diagram'?'active':'')+'" data-map-view="diagram">'+diagramLabel+'</button><button class="'+(S.mapView==='list'?'active':'')+'" data-map-view="list">'+listLabel+'</button></div>';const density='<div class="view-toggle"><button class="'+(S.mapDensity==='simple'?'active':'')+'" data-density="simple">'+simpleLabel+'</button><button class="'+(S.mapDensity==='full'?'active':'')+'" data-density="full">'+fullLabel+'</button></div>';const content=S.mapView==='list'?capabilityListView(map):(tree?layoutTreeMarkup(tree,map):'<div class="empty center">'+esc(tr('noLayoutZones'))+'</div>');const body='<section class="current-map-shell '+(S.mapDensity==='simple'?'simple':'full')+'"><div class="current-toolbar">'+tabs+density+'</div><div class="panel map-stage tree-stage">'+content+'</div><div class="hover-card" id="cap-hover-card"></div>'+detailDrawer(d,map)+'</section>';return shell(title,(map.mapScope&&map.mapScope.outcome)||map.mapScope&&map.mapScope.scenario||tr('currentSummary'),body,meta)}
      function layoutTreeMarkup(node,map){if(!node||typeof node!=='object')return'';if(node.type==='zone')return zoneTreeMarkup(node,map);const type=node.type==='split'?'split':'stack';const dir=node.direction||'vertical';return'<section class="layout-node layout-'+type+' dir-'+esc(dir)+'">'+(node.title?'<h2 class="layout-title">'+esc(text(node.title))+'</h2>':'')+'<div class="layout-children">'+arr(node.children).map(child=>layoutTreeMarkup(child,map)).join('')+'</div></section>'}
      function zoneTreeMarkup(zone,map){const idx=capIndex(map);const children=childIndex(map);const ids=arr(zone.capabilityIds);return'<section class="tree-zone '+esc(zone.role||'other')+'" data-zone="'+esc(zone.zoneId||'')+'"><header><span class="zone-role">'+esc(zone.role||'zone')+'</span><h2>'+esc(text(zone.title||zone.zoneId))+'</h2>'+(zone.purpose?'<p class="zone-purpose">'+esc(text(zone.purpose))+'</p>':'')+'</header><div class="zone-cap-list">'+(ids.length?ids.map(id=>capGroup(idx[id],children,map,id)).join(''):'<p class="muted">'+esc(tr('noCapabilityRefs'))+'</p>')+'</div></section>'}
      function capGroup(cap,children,map,id){if(!cap)return'<div class="cap-group missing">'+esc(tr('missingCapability'))+': '+esc(id)+'</div>';const rel=relatedIds(map,S.selectedCapabilityId);const cid=cap.capabilityId;const cls=[typedClass(cap.capabilityType),S.selectedCapabilityId&&cid!==S.selectedCapabilityId&&!rel.has(cid)?'dimmed':'',rel.has(cid)?'related':''].filter(Boolean).join(' ');const l2s=arr(children[cid]);return'<article class="cap-group '+esc(cls)+'"><div class="cap-hit"><button class="cap-main '+(cid===S.selectedCapabilityId?'active':'')+'" data-cap="'+esc(cid)+'"><span class="cap-id">'+esc(cid)+'</span><strong>'+esc(text(cap.name||cid))+'</strong><p>'+esc(text(cap.intent||''))+'</p>'+capTags(cap)+'</button></div>'+(l2s.length?'<div class="l2-grid">'+l2s.map(c=>l2Row(c,map)).join('')+'</div>':'')+'</article>'}

      function collectLayoutZones(node,out){if(!node||typeof node!=='object')return out;if(node.type==='zone')out.push(node);else arr(node.children).forEach(child=>collectLayoutZones(child,out));return out}
      function capabilityListView(map){const tree=map.layoutModel&&map.layoutModel.layoutTree;const zones=collectLayoutZones(tree,[]);const roots=arr(map.capabilities).filter(c=>!c.parentCapabilityId);const fallback=roots.length?[{zoneId:'capabilities',role:'zone',title:S.lang==='en'?'Capabilities':'能力列表',capabilityIds:roots.map(c=>c.capabilityId)}]:[];const source=zones.length?zones:fallback;return'<div class="capability-list-view">'+(source.length?source.map(z=>listZone(z,map)).join(''):'<div class="empty center">'+esc(tr('noCapabilityRefs'))+'</div>')+'</div>'}
      function listZone(zone,map){const idx=capIndex(map);const children=childIndex(map);const ids=arr(zone.capabilityIds);return'<section class="list-zone '+esc(zone.role||'other')+'"><header><span class="zone-role">'+esc(zone.role||'zone')+'</span><h2>'+esc(text(zone.title||zone.zoneId))+'</h2></header><div class="list-zone-body">'+(ids.length?ids.map(id=>listCap(idx[id],children,map,id)).join(''):'<p class="muted">'+esc(tr('noCapabilityRefs'))+'</p>')+'</div></section>'}
      function listCap(cap,children,map,id){if(!cap)return'<div class="list-cap missing">'+esc(tr('missingCapability'))+': '+esc(id)+'</div>';const rel=relatedIds(map,S.selectedCapabilityId);const cid=cap.capabilityId;const cls=[typedClass(cap.capabilityType),S.selectedCapabilityId&&cid!==S.selectedCapabilityId&&!rel.has(cid)?'dimmed':'',rel.has(cid)?'related':''].filter(Boolean).join(' ');const l2s=arr(children[cid]);return'<article class="list-cap '+esc(cls)+'"><button class="list-cap-main '+(cid===S.selectedCapabilityId?'active':'')+'" data-cap="'+esc(cid)+'"><span class="cap-id">'+esc(cid)+'</span><strong>'+esc(text(cap.name||cid))+'</strong><p>'+esc(text(cap.intent||''))+'</p>'+capTags(cap)+'</button><div class="list-l2s">'+l2s.map(c=>listL2(c,map)).join('')+'</div></article>'}
      function listL2(c,map){const rel=relatedIds(map,S.selectedCapabilityId);const cls=[c.capabilityId===S.selectedCapabilityId?'active':'',S.selectedCapabilityId&&c.capabilityId!==S.selectedCapabilityId&&!rel.has(c.capabilityId)?'dimmed':'',rel.has(c.capabilityId)?'related':''].filter(Boolean).join(' ');return'<button class="list-l2 '+esc(cls)+'" data-cap="'+esc(c.capabilityId)+'">'+esc(text(c.name||c.capabilityId))+'</button>'}

      function traceCount(obj){let n=0;if(!obj||typeof obj!=='object')return 0;Object.values(obj).forEach(v=>{n+=arr(v).length});return n}
      function relatedIds(map,id){const set=new Set();if(!id)return set;arr(map.relationships).forEach(r=>{if(r.fromCapabilityId===id)set.add(r.toCapabilityId);if(r.toCapabilityId===id)set.add(r.fromCapabilityId)});arr(map.capabilities).forEach(c=>{if(c.capabilityId===id){if(c.parentCapabilityId)set.add(c.parentCapabilityId);arr(c.dependsOn).forEach(x=>set.add(x));arr(c.supports).forEach(x=>set.add(x))}if(c.parentCapabilityId===id)set.add(c.capabilityId);if(arr(c.dependsOn).includes(id)||arr(c.supports).includes(id))set.add(c.capabilityId)});return set}
      function detailDrawer(rootData,map){const cap=arr(map.capabilities).find(c=>c.capabilityId===S.selectedCapabilityId);if(!cap)return'';return'<div class="drawer-backdrop" data-close-detail></div><aside class="detail-drawer"><div class="detail-head"><div><span class="cap-id">'+esc(cap.capabilityId)+'</span><h2>'+esc(text(cap.name||cap.capabilityId))+'</h2></div><button class="icon-btn" data-close-detail>×</button></div><div class="detail-tabs">'+['overview','trace','downstream','relations'].map(t=>'<button class="detail-tab '+(S.detailTab===t?'active':'')+'" data-detail-tab="'+t+'">'+esc(titleize(t))+'</button>').join('')+'</div><div class="detail-pane">'+detailPane(S.detailTab||'overview',cap,rootData,map)+'</div></aside>'}
      function detailPane(tab,cap,rootData,map){if(tab==='trace')return tracePane(cap,rootData,map);if(tab==='downstream')return downstreamPane(cap);if(tab==='relations')return relationsPane(cap,map);return overviewPane(cap)}
      function overviewPane(c){return'<h3>Overview</h3>'+detailKv({capabilityId:c.capabilityId,level:c.level,type:c.capabilityType,reuseLevel:c.reuseLevel,granularity:c.granularity,maturity:c.maturity,parentCapabilityId:c.parentCapabilityId})+'<p>'+esc(text(c.intent))+'</p>'+detailList('In Scope',c.inScope)+detailList('Out Of Scope',c.outOfScope)+detailList('Success Signals',c.successSignals)}
      function tracePane(c,rootData,map){const groups=Object.assign({},c.sourceTrace||{});groups.sourceRefs=c.sourceRefs;groups.evidenceRefs=arr(c.evidenceRefs).concat(arr(map.evidenceRefs),arr(rootData.evidenceRefs));groups.artifactRefs=[rootData.sourceJourneyRef,rootData.sourceFlowRef,rootData.sourcePrototypeRef].filter(Boolean);return Object.entries(groups).map(([k,v])=>'<section class="trace-group"><h3>'+esc(titleize(k))+'</h3>'+list(v)+'</section>').join('')||'<p class="muted">-</p>'}

      function detailList(title,items){return'<section><h3>'+esc(title)+'</h3>'+list(items)+'</section>'}
      function moveHoverCard(card,ev){const margin=12,w=340,h=190;let left=ev.clientX+14,top=ev.clientY+14;if(left+w>window.innerWidth-margin)left=ev.clientX-w-14;if(top+h>window.innerHeight-margin)top=ev.clientY-h-14;card.style.left=Math.max(margin,left)+'px';card.style.top=Math.max(margin,top)+'px'}
      function labelUnits(label){return Array.from(String(label||'')).reduce((sum,ch)=>sum+(ch.charCodeAt(0)>255?1.55:.62),0)}
      function estimateCompareCardWidth(card){const labels=[...card.querySelectorAll('strong,.compare-chip')].map(x=>x.textContent);const longest=Math.max(0,...labels.map(labelUnits));return Math.round(Math.min(Math.max(longest*8+30,92),220))}

      function scheduleComparePacking(){optimizeComparePacking();if(!S.compareResizeHooked){S.compareResizeHooked=true;let t=0;window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>{if(S.data&&detect(S.data)==='exploration')optimizeComparePacking()},120)})}}
      function estimateChipWidth(label,cardWidth){return Math.min(Math.max(String(label||'').length*10+24,72),Math.max(72,cardWidth-18))}
      function estimateRows(labels,cardWidth){let rows=1,used=0;arr(labels).forEach(label=>{const w=estimateChipWidth(label,cardWidth);if(used&&used+w+5>cardWidth){rows++;used=w}else used+=used?5+w:w});return rows}
      function estimateCardHeight(card,cardWidth){const title=card.querySelector('.cap-main strong');const intent=card.querySelector('.cap-main p');const labels=[...card.querySelectorAll('.l2-row')].map(x=>x.textContent);const titleLines=Math.max(1,Math.ceil((title&&title.textContent.length||0)*7/Math.max(90,cardWidth)));const intentLines=Math.min(3,Math.max(1,Math.ceil((intent&&intent.textContent.length||0)*5/Math.max(120,cardWidth))));return 70+titleLines*15+intentLines*13+estimateRows(labels,cardWidth)*25}
      function chooseZoneColumns(list){const cards=[...list.querySelectorAll(':scope > .cap-group')];const n=cards.length;if(n<2)return 1;const width=list.clientWidth||list.getBoundingClientRect().width||280;const gap=8;const maxCols=Math.max(1,Math.min(n,Math.floor((width+gap)/(220+gap)),6));let best={cols:1,score:Infinity};for(let cols=1;cols<=maxCols;cols++){const cardWidth=(width-gap*(cols-1))/cols;const heights=Array(cols).fill(0);cards.forEach(card=>{let idx=0;for(let i=1;i<cols;i++)if(heights[i]<heights[idx])idx=i;heights[idx]+=estimateCardHeight(card,cardWidth)+8});const score=Math.max(...heights)+cols*10;if(score<best.score)best={cols,score}}return best.cols}

      async function loadDemoFromQuery(){const params=new URLSearchParams(window.location&&window.location.search||'');const mode=params.get('demo');if(!mode)return false;const paths=demoFiles[mode];if(!paths)throw new Error('Unknown demo mode: '+mode);let lastError=null;for(const path of paths){try{const response=await fetch(path);if(!response.ok){lastError=new Error('Demo '+path+' returned '+response.status);continue}render(parse(await response.text()));return true}catch(err){lastError=err}}throw lastError||new Error('Unable to load demo: '+mode)}
