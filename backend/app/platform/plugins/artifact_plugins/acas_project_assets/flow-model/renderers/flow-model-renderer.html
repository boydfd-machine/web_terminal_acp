<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACAS Flow Model Renderer</title>
  <style>
    :root{--bg:#f7f5f2;--panel:#fffdfa;--soft:#f1ece4;--ink:#1a1c1e;--muted:#66707a;--line:#d9d1c7;--user:#245b7a;--system:#1f6b57;--agent:#7a4d1f;--external:#5d557c;--risk:#b8422e;--edge:#4e5a64;--shadow:0 16px 38px rgba(26,28,30,.08);font-family:Inter,"Public Sans",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}main{min-width:390px;padding:18px}button{font:inherit}h1,h2,h3,p{margin:0;letter-spacing:0;overflow-wrap:anywhere}
    .shell{width:min(94vw,1680px);margin:0 auto;display:grid;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
    .top{padding:18px 20px;display:grid;gap:12px}.bar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}h1{font-size:22px;line-height:1.2;font-weight:780}.summary{max-width:900px;color:var(--muted);font-size:13px;line-height:1.45;margin-top:5px}
    .chips,.tabs,.lang{display:flex;flex-wrap:wrap;gap:8px;min-width:0}.chip{min-width:0;max-width:100%;border:1px solid var(--line);border-radius:999px;background:var(--soft);padding:5px 10px;font-size:12px;color:var(--muted);overflow-wrap:anywhere;word-break:break-word}
    .flow-tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.flow-tabs button{min-width:0;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;cursor:pointer;color:var(--ink)}.flow-tabs button.active{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:#fbf7ef}.flow-kind{display:inline-flex;border-radius:999px;background:var(--soft);color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 7px;margin-bottom:6px}.flow-kind.primary{background:#e8f2ed;color:var(--system)}.flow-kind.branch{background:#fff1ea;color:var(--risk)}.flow-title{display:block;font-size:13px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}.flow-source{display:block;margin-top:5px;color:var(--muted);font-size:11px;line-height:1.3;overflow-wrap:anywhere}
    .layer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.layer-card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:13px;display:grid;gap:8px;align-content:start;min-width:0}.layer-card h2{font-size:14px}.layer-card h3{font-size:13px}.layer-card p,.layer-card li{font-size:12px;line-height:1.42;color:var(--muted);overflow-wrap:anywhere}.trace-table{display:grid;overflow:auto}.trace-row{display:grid;grid-template-columns:1fr 1fr 1fr 1.2fr;border-bottom:1px solid var(--line)}.trace-row>div{padding:9px;border-right:1px solid var(--line);font-size:12px;line-height:1.38;overflow-wrap:anywhere}.trace-row.head>div{background:#efe8dd;font-weight:800;color:var(--ink)}.option-card{border:1px solid var(--line);border-left:5px solid var(--system);border-radius:8px;background:#fff;padding:10px;display:grid;gap:6px}.option-card.recommended{background:#f5fbf7}.question-card{border-left:5px solid var(--risk)}
    .graph-panel{display:grid}.graph-toolbar{display:flex;justify-content:flex-end;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);background:rgba(255,253,250,.96);position:sticky;left:0;z-index:40}.legend{display:grid;gap:8px;width:210px;border:1px solid var(--line);border-radius:8px;background:rgba(255,253,250,.98);box-shadow:0 8px 24px rgba(26,28,30,.08);padding:10px}.legend.collapsed{width:auto}.legend.collapsed .legend-body{display:none}.legend-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.legend-head strong{font-size:12px}.legend button{border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--muted);font-size:12px;padding:4px 7px;cursor:pointer}.legend-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}.legend-row input{margin:0}.legend-swatch{width:28px;height:0;border-top:3px solid var(--edge)}.legend-swatch.guard{border-top-color:var(--risk);border-top-style:dashed}.legend-swatch.back{border-top-color:#7357a7;border-top-style:dashed}
    .tabs button,.lang button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 11px;color:var(--muted);cursor:pointer}.tabs button.active,.lang button.active{background:var(--ink);border-color:var(--ink);color:#fff}.tabs button:hover,.lang button:hover{border-color:#bdaea0;color:var(--ink)}
    .graph-wrap{overflow:auto}.graph-space{position:relative;min-width:var(--graph-w,calc(var(--lane-w,176px) + var(--cols)*230px))}.matrix{display:grid;grid-template-columns:var(--tracks,var(--lane-w,176px) repeat(var(--cols),230px));position:relative;align-items:stretch}.cell{min-width:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:138px;padding:10px;background:rgba(255,253,250,.92);overflow:visible}.corner,.step,.lane-label{position:sticky}.corner{left:0;top:0;z-index:28;background:#e9e1d7}.step{top:0;z-index:18;background:linear-gradient(180deg,#fffdfa,#f1ece4);min-height:80px}.step h2{font-size:12px;font-weight:800}.step p{font-size:11px;color:var(--muted);line-height:1.35;margin-top:4px}.num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:99px;background:var(--ink);color:#fff;font-size:11px;font-weight:800;margin-bottom:7px}
    .lane-label{left:0;z-index:27;background:#f3eee7;border-left:5px solid var(--muted);display:flex;flex-direction:column;justify-content:center;box-shadow:8px 0 14px rgba(26,28,30,.08)}.lane-label h2{font-size:13px;font-weight:800}.lane-label p{font-size:11px;color:var(--muted);line-height:1.35;margin-top:5px}.lane-label.user{border-left-color:var(--user)}.lane-label.product_system{border-left-color:var(--system)}.lane-label.human_or_agent{border-left-color:var(--agent)}.lane-label.external_system{border-left-color:var(--external)}
    .node{position:relative;z-index:6;min-height:118px;height:100%;min-width:0;max-width:100%;border:1px solid var(--line);border-left:5px solid var(--muted);border-radius:8px;background:#fff;padding:10px;display:grid;align-content:start;gap:7px;box-shadow:0 6px 16px rgba(26,28,30,.06);overflow-wrap:anywhere;word-break:break-word;transition:border-color .16s,box-shadow .16s,transform .16s}.node.active{border-color:#1a1c1e;box-shadow:0 10px 28px rgba(26,28,30,.18);transform:translateY(-1px)}.node.dim{opacity:.42}.node.user{border-left-color:var(--user)}.node.product_system{border-left-color:var(--system)}.node.human_or_agent{border-left-color:var(--agent)}.node.external_system{border-left-color:var(--external)}.node.decision{background:#fff8df}.node.wait{background:#fff5e0}.node.recovery{background:#fff1ea}.node.end{background:#edf6ef}
    .node h3{font-size:13px;line-height:1.25;font-weight:780;min-width:0;overflow-wrap:anywhere}.meta{display:flex;gap:5px;flex-wrap:wrap;min-width:0}.pill{min-width:0;max-width:100%;border:1px solid var(--line);border-radius:999px;background:#faf7f1;padding:3px 7px;font-size:11px;color:var(--muted);overflow-wrap:anywhere;word-break:break-word}.outputs,.states{display:grid;gap:4px;min-width:0}.outputs span,.states span{display:block;min-width:0;font-size:12px;line-height:1.35;overflow-wrap:anywhere;word-break:break-word}.outputs b,.states b{font-size:10px;text-transform:uppercase;margin-right:5px}.outputs b{color:#23714d}.states b{color:#a66a00}.empty{color:#b1a79d;font-size:12px;display:grid;place-items:center;min-height:118px;border:1px dashed var(--line);border-radius:8px;background:rgba(251,248,243,.78)}
    .edge-layer{position:absolute;inset:0;z-index:7;pointer-events:stroke;overflow:visible}.edge-path{fill:none;stroke:var(--edge);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;transition:opacity .16s,stroke-width .16s,filter .16s;animation:edgeFlow 1.8s linear infinite;stroke-dasharray:10 8}.edge-path.guard{stroke:var(--risk);stroke-dasharray:8 7}.edge-path.back{stroke:#7357a7;stroke-dasharray:4 7}.edge-path.hover{stroke-width:4;filter:drop-shadow(0 0 4px rgba(26,28,30,.28))}.edge-path.dim,.edge-label.dim{opacity:.14}.edge-path.hidden,.edge-label.hidden{display:none}.edge-label{pointer-events:auto;transition:opacity .16s}.edge-label rect{fill:#fffdfa;stroke:var(--line);rx:7}.edge-label text{font-size:11px;fill:#3f4850;font-weight:700}@keyframes edgeFlow{to{stroke-dashoffset:-36}}
    .details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.section{min-width:0;padding:14px;display:grid;gap:10px}.section h2{font-size:14px}.exception,.question{min-width:0;border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;font-size:12px;line-height:1.4;overflow-wrap:anywhere;word-break:break-word}.exception{border-left:5px solid var(--risk)}.question{border-left:5px solid var(--external)}.waiting,.error{border:1px dashed var(--line);border-radius:8px;background:var(--panel);color:var(--muted);padding:16px}.error{border-color:#edbbbb;color:#933}
    @media(max-width:860px){main{padding:10px}.bar,.details{display:grid;grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main id="root"><div class="waiting">Waiting for ACAS flow_model data...</div></main>
  <script>
    (function(){
      const root=document.getElementById('root');
      const T={en:{source:'source',journey:'journey option',reviewed:'reviewed',flow:'flow',primary:'primary',branch:'branch',branchType:'branch type',output:'out',state:'state',recovery:'Recovery',reviewer:'Reviewer',empty:'',risks:'Risks, Questions, Review',sources:'Journey Sources',none:'No exceptions or questions'},zh:{source:'来源',journey:'旅程选项',reviewed:'已审阅',flow:'流程',primary:'主流程',branch:'分支',branchType:'分支类型',output:'输出',state:'状态',recovery:'恢复节点',reviewer:'评审人',empty:'',risks:'风险、问题与评审',sources:'Journey 来源',none:'无异常或问题'}};
      let state={data:null,tab:null,flow:null,lang:'zh',model:null,show:{flow:true,guard:true,back:true},legendOpen:true};
      function tr(k){return T[state.lang][k]||k}function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function loc(v){return v&&typeof v==='object'&&!Array.isArray(v)?(v[state.lang]||v.en||v.zh||''):v}function arr(v){return Array.isArray(v)?v.filter(Boolean):(v==null||v===''?[]:[v])}
      function parse(input){const r=input&&input.resource?input.resource:input;const raw=r&&typeof r.content==='string'?r.content:r;if(typeof raw==='string')return normalize(JSON.parse(raw));if(raw&&typeof raw==='object')return normalize(raw);throw new Error('No flow_model JSON resource found')}
      function normalize(d){return d&&d.flowSet?Object.assign({},d.flowSet,{sourceJourneyRef:d.sourceJourneyRef||d.flowSet.sourceJourneyRef,selectedJourneyOptionId:d.selectedJourneyOptionId||d.flowSet.selectedJourneyOptionId,reviewTrace:d.decisionTrace||d.flowSet.reviewTrace,evidenceRefs:d.evidenceRefs||d.flowSet.evidenceRefs,openRisks:d.openRisks||d.flowSet.openRisks,assumptions:d.assumptions||d.flowSet.assumptions}):d}
      function detect(d){if(d.kind==='FlowModelRaw'||d.layer==='Raw')return'raw';if(d.kind==='FlowModelExploration'||d.layer==='Exploration'||d.flowSetOptions)return'exploration';return'current'}
      function layerShell(title,summary,body,meta=''){return'<div class="shell"><section class="panel top"><div class="bar"><div><h1>'+esc(loc(title)||'Flow Model')+'</h1><p class="summary">'+esc(loc(summary)||'')+'</p></div><div class="lang"><button data-lang="zh" class="'+(state.lang==='zh'?'active':'')+'">中文</button><button data-lang="en" class="'+(state.lang==='en'?'active':'')+'">English</button></div></div>'+meta+'</section>'+body+'</div>'}
      function simpleList(items){const xs=arr(items).map(loc).filter(Boolean);return xs.length?'<ul>'+xs.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>-</p>'}
      function rawView(d){const b=d.boundary||{};const rows=arr(d.flowSignals).map(s=>'<div class="trace-row"><div>'+esc(s.signalId)+'</div><div>'+esc(s.signalType)+'</div><div>'+esc(s.candidateNodeId||s.candidateEvent||s.candidateGuard||'')+'</div><div>'+esc(s.sourceRef||'')+'</div></div>').join('');const branches=arr(d.branchCandidates).map(x=>'<section class="layer-card question-card"><h3>'+esc(x.branchId)+'</h3><p>'+esc(x.branchType+' · '+x.recommendedTreatment)+'</p>'+simpleList([x.reasonToSplit])+'</section>').join('');return layerShell('Flow Model Raw','Source trace extracted from reviewed User Journey Current.','<section class="layer-grid">'+cardBlock('Boundary',chip(tr('source'),d.sourceJourneyRef)+chip(tr('journey'),d.selectedJourneyOptionId)+chip('actor',b.actor)+chip('scenario',b.scenario)+chip('confidence',b.confidence))+cardBlock('Branch Candidates',branches||'<p>-</p>')+cardBlock('Open Questions',simpleList(d.openQuestions))+'</section><section class="panel section"><h2>Flow Signals</h2><div class="trace-table"><div class="trace-row head"><div>Signal</div><div>Type</div><div>Candidate</div><div>Source</div></div>'+rows+'</div></section>')}
      function explorationView(d){const opts=arr(d.flowSetOptions);const active=opts.find(o=>o.optionId===state.tab)||opts.find(o=>o.optionId===d.recommendedOptionId)||opts[0]||{};const nav='<nav class="flow-tabs">'+opts.map(o=>'<button data-tab="'+esc(o.optionId)+'" class="'+(active.optionId===o.optionId?'active':'')+'"><span class="flow-kind '+(o.optionId===d.recommendedOptionId?'primary':'')+'">'+esc(o.optionId===d.recommendedOptionId?tr('primary'):tr('branch'))+'</span><span class="flow-title">'+esc(loc(o.title)||o.optionId)+'</span><span class="flow-source">'+esc(loc(o.strategy)||'')+'</span></button>').join('')+'</nav>';const qs=questionCards(d.clarificationQuestions);return layerShell('Flow Model Exploration',d.recommendationRationale,nav+'<section class="layer-grid">'+cardBlock('Selected Option',chip('option',active.optionId)+chip('primaryFlowId',active.primaryFlowId)+simpleList(active.tradeoffs))+cardBlock('Branch Coverage',simpleList(active.branchCoverage))+cardBlock('Clarification Questions',qs||'<p>-</p>')+'</section>')}
      function questionCards(items){return arr(items).map(q=>'<section class="layer-card question-card"><h3>'+esc(q.questionId)+' · '+esc(loc(q.question))+'</h3><p>'+esc(loc(q.whyItMatters))+'</p><div class="chips">'+arr(q.affects).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>'+optionCards(q)+'</section>').join('')}
      function optionCards(q){return arr(q.options).map(o=>{const rec=o.optionId===q.recommendedOptionId;return'<div class="'+(rec?'option-card recommended':'option-card')+'"><h3>'+esc(o.label)+' '+esc(loc(o.title)||loc(o.value)||o.optionId)+'</h3>'+(rec?'<p><strong>recommended</strong></p>':'')+para(o.description)+impactSummary(o.impact)+'</div>'}).join('')}
      function impactSummary(impact){if(!impact)return'';return para(impact.summary)+'<div class="chips">'+arr(impact.affectedScopes).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+arr(impact.downstreamArtifactTypes).map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+(impact.riskDelta?'<span class="chip">'+esc(impact.riskDelta)+'</span>':'')+'</div>'}
      function cardBlock(title,body){return'<section class="layer-card"><h2>'+esc(title)+'</h2>'+body+'</section>'}
      function options(d){return arr(d.options).filter(o=>arr(o.nodes).length)}function flows(d){return arr(d.flows).filter(f=>arr(f.nodes).length)}function active(d){const fs=flows(d);if(fs.length){const firstPrimary=fs.find(f=>f.kind==='primary')||fs[0];const id=state.flow||d.primaryFlowId||firstPrimary.flowId;const f=fs.find(x=>x.flowId===id)||firstPrimary;return Object.assign({},d,f,{scope:f.scope||d.scope,lanes:f.lanes||d.lanes,sourceJourneyRef:f.sourceJourneyRef||d.sourceJourneyRef,selectedJourneyOptionId:f.selectedJourneyOptionId||d.selectedJourneyOptionId})}const opts=options(d);if(opts.length){const id=state.tab||d.recommendedOptionId||opts[0].optionId;return opts.find(o=>o.optionId===id)||opts[0]}return d}
      function render(data){data=normalize(data);state.data=data;const mode=detect(data);if(mode==='raw'){root.innerHTML=rawView(data);wire(data);return}if(mode==='exploration'){root.innerHTML=explorationView(data);wire(data);return}const model=active(data);state.model=model;const lanes=lanesOf(model);const steps=stepsOf(model);const vars=layoutVars(lanes,steps,model);root.innerHTML='<div class="shell">'+header(data,model)+'<section class="panel graph-panel"><div class="graph-toolbar">'+legend()+'</div><div class="graph-wrap"><div class="graph-space" style="--cols:'+Math.max(steps.length,1)+';--lane-w:'+vars.laneW+'px;--graph-w:'+vars.graphW+'px;--tracks:'+vars.tracks+'"><div class="matrix">'+matrix(lanes,steps,model)+'</div><svg class="edge-layer" aria-hidden="true"></svg></div></div></section>'+details(model)+'</div>';wire(data);requestAnimationFrame(drawEdges)}
      function textLen(v){const s=String(loc(v)||'');let n=0;for(const ch of s)n+=ch.charCodeAt(0)>255?1.7:1;return n}
      function layoutVars(lanes,steps,m){const laneLen=Math.max(0,...lanes.map(l=>Math.max(textLen(l.title),textLen(l.description))));const laneW=clamp(176+Math.max(0,laneLen-12)*3.4,176,260);const colWs=steps.map(s=>columnWidth(s));return{laneW,graphW:laneW+colWs.reduce((a,b)=>a+b,0),tracks:[laneW].concat(colWs).map(w=>w+'px').join(' ')}}
      function columnWidth(s){const n=s.node||{};let score=Math.max(textLen(n.title),textLen(n.nodeId),textLen(s.id))*1.3;arr(n.outputs).concat(arr(n.evidenceRefs)).forEach(x=>score=Math.max(score,textLen(x)));if(n.stateChanges&&typeof n.stateChanges==='object')Object.keys(n.stateChanges).forEach(k=>score=Math.max(score,textLen(k+' '+loc(n.stateChanges[k]))));return clamp(230+Math.max(0,score-22)*2.9,230,360)}
      function clamp(v,min,max){return Math.max(min,Math.min(max,Math.round(v)))}
      function header(data,m){const opts=options(data),fs=flows(data);return '<section class="panel top"><div class="bar"><div><h1>'+esc(loc(m.scope&&m.scope.scenario)||loc(m.title)||'Flow Model')+'</h1><p class="summary">'+esc([m.scope&&loc(m.scope.actor),m.scope&&loc(m.scope.trigger),m.scope&&loc(m.scope.outcome)].filter(Boolean).join(' · '))+'</p></div><div class="lang"><button data-lang="zh" class="'+(state.lang==='zh'?'active':'')+'">中文</button><button data-lang="en" class="'+(state.lang==='en'?'active':'')+'">English</button></div></div><div class="chips">'+chip(tr('flow'),m.flowId||m.optionId||data.flowSetId)+chip(tr('primary'),data.primaryFlowId)+chip(tr('source'),m.sourceJourneyRef||data.sourceJourneyRef)+chip(tr('journey'),m.selectedJourneyOptionId||data.selectedJourneyOptionId)+chip(tr('branchType'),m.branchType)+chip(tr('reviewed'),m.reviewTrace&&m.reviewTrace.reviewer)+'</div>'+flowNav(data,m,fs)+(opts.length?'<nav class="tabs">'+opts.map(o=>'<button data-tab="'+esc(o.optionId)+'" class="'+(active(data).optionId===o.optionId?'active':'')+'">'+esc(loc(o.title)||o.optionId)+'</button>').join('')+'</nav>':'')+'</section>'}
      function flowNav(data,m,fs){return fs.length?'<nav class="flow-tabs">'+fs.map(f=>{const kind=f.kind||'branch';const src=firstSource(f)||f.sourceJourneyRef||data.sourceJourneyRef||'';return'<button data-flow="'+esc(f.flowId)+'" class="'+(m.flowId===f.flowId?'active':'')+'"><span class="flow-kind '+esc(kind)+'">'+esc(kind==='primary'?tr('primary'):tr('branch'))+'</span><span class="flow-title">'+esc(loc(f.title)||f.flowId)+'</span><span class="flow-source">'+esc(src)+'</span></button>'}).join('')+'</nav>':''}
      function firstSource(m){const s=arr(m.sourceJourneyRefs)[0];return s?(s.journeyRef||s.sourceJourneyRef||s.ref||'')+(s.branchRef?' #'+s.branchRef:''):''}
      function legend(){return '<aside class="legend '+(state.legendOpen?'':'collapsed')+'"><div class="legend-head"><strong>Legend</strong><button data-legend-toggle>'+(state.legendOpen?'Hide':'Show')+'</button></div><div class="legend-body"><label class="legend-row"><input type="checkbox" data-edge-toggle="flow" '+(state.show.flow?'checked':'')+'><span class="legend-swatch"></span><span>Flow</span></label><label class="legend-row"><input type="checkbox" data-edge-toggle="guard" '+(state.show.guard?'checked':'')+'><span class="legend-swatch guard"></span><span>Guard</span></label><label class="legend-row"><input type="checkbox" data-edge-toggle="back" '+(state.show.back?'checked':'')+'><span class="legend-swatch back"></span><span>Back edge / cycle</span></label></div></aside>'}
      function chip(k,v){return v?'<span class="chip">'+esc(k)+': '+esc(loc(v))+'</span>':''}
      function lanesOf(m){const ids=[...new Set(arr(m.lanes).map(l=>l.laneId).concat(arr(m.nodes).map(n=>n.laneId).filter(Boolean)))];return ids.map(id=>arr(m.lanes).find(l=>l.laneId===id)||{laneId:id,title:id.replace(/_/g,' ')})}
      function stepsOf(m){const nodes=arr(m.nodes);const ids=[];const add=id=>{if(id&&!ids.includes(id))ids.push(id)};if(nodes[0])add(nodes[0].nodeId);arr(m.edges).forEach(e=>{add(e.from);add(e.to)});nodes.forEach(n=>add(n.nodeId));return ids.map((id,i)=>({id,index:i+1,node:nodes.find(n=>n.nodeId===id)||{nodeId:id,title:id}}))}
      function matrix(lanes,steps,m){return '<div class="cell corner"></div>'+steps.map(s=>'<div class="cell step"><span class="num">'+s.index+'</span><h2>'+esc(loc(s.node.title)||s.id)+'</h2><p>'+esc(s.id)+'</p></div>').join('')+lanes.map(l=>row(l,steps,m)).join('')}
      function row(l,steps,m){return '<div class="cell lane-label '+esc(l.laneId)+'"><h2>'+esc(loc(l.title)||l.laneId)+'</h2><p>'+esc(loc(l.description)||'Responsibility lane')+'</p></div>'+steps.map(s=>cell(l,s,m)).join('')}
      function cell(l,s,m){const n=arr(m.nodes).find(x=>x.nodeId===s.id&&x.laneId===l.laneId);return '<div class="cell">'+(n?node(n):'<div class="empty">'+tr('empty')+'</div>')+'</div>'}
      function node(n){return '<article class="node '+esc((n.laneId||'')+' '+(n.type||''))+'" data-node-id="'+esc(n.nodeId)+'"><h3>'+esc(loc(n.title)||n.nodeId)+'</h3><div class="meta">'+pill(n.type)+pill(n.derivedFrom)+'</div>'+kv(n.stateChanges)+list(n.outputs,tr('output'))+list(n.evidenceRefs,tr('source'))+'</article>'}
      function pill(v){return v?'<span class="pill">'+esc(v)+'</span>':''}function list(items,label){const xs=arr(items);return xs.length?'<div class="outputs">'+xs.map(x=>'<span><b>'+esc(label)+'</b>'+esc(loc(x))+'</span>').join('')+'</div>':''}function kv(obj){if(!obj||typeof obj!=='object'||Array.isArray(obj))return'';return '<div class="states">'+Object.keys(obj).map(k=>'<span><b>'+esc(tr('state'))+'</b>'+esc(k+' -> '+loc(obj[k]))+'</span>').join('')+'</div>'}
      function details(m){return '<section class="details"><div class="panel section"><h2>'+tr('sources')+'</h2>'+sources(m)+'</div><div class="panel section"><h2>'+tr('risks')+'</h2>'+extras(m)+'</div><div class="panel section"><h2>Review</h2>'+review(m)+'</div></section>'}
      function sources(m){const ss=arr(m.sourceJourneyRefs);if(ss.length)return ss.map(s=>'<div class="question"><strong>'+esc(s.branchRef||s.phaseRef||s.journeyRef||'source')+'</strong>'+para(s.journeyRef||s.sourceJourneyRef||m.sourceJourneyRef)+para(s.note||s.rationale||'')+'</div>').join('');return m.sourceJourneyRef?'<div class="question">'+esc(m.sourceJourneyRef)+'</div>':'<div class="question">'+tr('none')+'</div>'}
      function para(v){return loc(v)?'<p>'+esc(loc(v))+'</p>':''}function extras(m){const ex=arr(m.exceptions).map(e=>'<div class="exception"><strong>'+esc(loc(e.label)||e.exceptionId)+'</strong>'+para(tr('recovery')+': '+(e.recoveryNodeId||'unassigned'))+'</div>').join('');const qs=arr(m.openQuestions).map(q=>'<div class="question">'+esc(loc(q))+'</div>').join('');return ex+qs||'<div class="question">'+tr('none')+'</div>'}function review(m){return m.reviewTrace?'<div class="question"><strong>'+esc(m.reviewTrace.selectedOptionId||'review')+'</strong>'+para(m.reviewTrace.rationale)+para(tr('reviewer')+': '+(m.reviewTrace.reviewer||'unknown'))+'</div>':'<div class="question">'+tr('none')+'</div>'}
      function drawEdges(){const svg=root.querySelector('.edge-layer'),space=root.querySelector('.graph-space'),m=state.model;if(!svg||!space||!m)return;const box=space.getBoundingClientRect();svg.setAttribute('width',space.scrollWidth);svg.setAttribute('height',space.scrollHeight);svg.setAttribute('viewBox','0 0 '+space.scrollWidth+' '+space.scrollHeight);svg.innerHTML='<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="var(--edge)"/></marker><marker id="arrowGuard" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="var(--risk)"/></marker></defs>';const routes=prepareRoutes(m,box);routes.forEach((r,i)=>edge(svg,r,i));bindEdgeHover()}
      function nodeBox(id,box){const el=root.querySelector('[data-node-id="'+CSS.escape(id)+'"]');if(!el)return null;const r=el.getBoundingClientRect(),c=el.closest('.cell').getBoundingClientRect();return{left:r.left-box.left,right:r.right-box.left,top:r.top-box.top,bottom:r.bottom-box.top,cx:r.left-box.left+r.width/2,cy:r.top-box.top+r.height/2,w:r.width,h:r.height,cellLeft:c.left-box.left,cellRight:c.right-box.left,cellTop:c.top-box.top,cellBottom:c.bottom-box.top}}
      function prepareRoutes(m,box){const items=arr(m.edges).map((e,i)=>{const a=nodeBox(e.from,box),b=nodeBox(e.to,box);if(!a||!b)return null;const back=b.cx<a.cx;const colKey=Math.round((a.cellRight+b.cellLeft)/34);const laneKey=Math.round((a.cellTop+b.cellTop)/34);return{e,i,a,b,back,key:(back?'b':'f')+':'+colKey+':'+laneKey}}).filter(Boolean);const topChannel=Math.min(...items.flatMap(r=>[r.a.cellTop,r.b.cellTop]))+7;const counts={};items.forEach(r=>{r.topChannel=topChannel;counts[r.key]=(counts[r.key]||0)+1;r.slot=counts[r.key]-1;r.count=counts[r.key]});const totals={};items.forEach(r=>totals[r.key]=Math.max(totals[r.key]||0,r.count));items.forEach(r=>{r.count=totals[r.key];r.offset=(r.slot-(r.count-1)/2)*7});return items}
      function edge(svg,r,i){const e=r.e,guard=!!e.guard;const type=r.back?'back':guard?'guard':'flow';const route=routePath(r);const hidden=!state.show[type];svg.insertAdjacentHTML('beforeend','<path class="edge-path '+(guard?'guard ':'')+(r.back?'back ':'')+(hidden?'hidden':'')+'" data-edge-type="'+type+'" data-from="'+esc(e.from)+'" data-to="'+esc(e.to)+'" d="'+route.p+'" marker-end="url(#'+(guard?'arrowGuard':'arrow')+')"/>');const label=loc(e.label||e.event||e.guard);if(label)labelEl(svg,label,route.lx,route.ly,i,type,e.from,e.to,hidden)}
      function routePath(r){const a=r.a,b=r.b,o=r.offset;if(r.back)return backRoute(a,b,o,r.topChannel);const sameRow=Math.abs(a.cellTop-b.cellTop)<2;const adjacent=Math.abs(a.cellRight-b.cellLeft)<4;const sx=a.right+2,sy=a.cy+o,tx=b.left-2,ty=b.cy-o;if(sameRow&&adjacent)return{p:`M ${sx} ${sy} L ${tx} ${ty}`,lx:(sx+tx)/2,ly:sy-18};const x1=(adjacent?(a.cellRight+b.cellLeft)/2:a.cellRight)+o;const x2=(adjacent?x1:b.cellLeft)-o;let y;if(sameRow)y=a.cellTop+7+Math.max(-4,Math.min(4,o));else y=b.cy>a.cy?a.cellBottom-7-Math.max(-4,Math.min(4,o)):a.cellTop+7+Math.max(-4,Math.min(4,o));return{p:`M ${sx} ${sy} L ${x1} ${sy} L ${x1} ${y} L ${x2} ${y} L ${x2} ${ty} L ${tx} ${ty}`,lx:(x1+x2)/2,ly:y-16}}

      function labelEl(svg,text,x,y,i,type,from,to,hidden){const short=String(text).slice(0,34);svg.insertAdjacentHTML('beforeend','<g class="edge-label '+(hidden?'hidden':'')+'" data-edge-type="'+type+'" data-from="'+esc(from)+'" data-to="'+esc(to)+'" transform="translate('+Math.max(8,x-66)+' '+Math.max(8,y-13)+')"><rect width="132" height="24"></rect><text x="66" y="16" text-anchor="middle">'+esc(short)+'</text></g>')}
