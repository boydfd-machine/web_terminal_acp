<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACAS UI Spec Renderer</title>
  <style>
    :root {
      --bg: #f7f5f2;
      --panel: #fffdfa;
      --panel-strong: #ffffff;
      --ink: #1a1c1e;
      --muted: #6c7278;
      --line: #ddd6cc;
      --line-strong: #c8bfb2;
      --accent: #b8422e;
      --accent-soft: #f6e5df;
      --ok: #1f6b57;
      --ok-soft: #e3f2ec;
      --warn: #a66a00;
      --warn-soft: #fff2d6;
      --shadow: 0 18px 42px rgba(26, 28, 30, 0.08);
      font-family: Inter, "Public Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    main { min-width: 360px; padding: 24px; }
    h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
    h1 { font-size: clamp(28px, 4vw, 44px); letter-spacing: -0.03em; }
    h2 { font-size: 20px; margin-bottom: 12px; }
    h3 { font-size: 16px; margin-bottom: 8px; }
    h4 { font-size: 13px; color: var(--muted); margin: 12px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    p { margin: 0 0 10px; line-height: 1.55; }
    ul, ol { margin: 8px 0 0; padding-left: 20px; }
    li { margin: 4px 0; line-height: 1.45; }
    code { background: #f4eee6; border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
    iframe { display: block; }

    .shell { display: grid; gap: 16px; width: min(92vw, 1680px); margin: 0 auto; }
    .panel, .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
    .top { padding: 20px 24px; display: grid; gap: 10px; }
    .summary { color: var(--muted); font-size: 14px; max-width: 980px; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; }
    .lang-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
    .lang-controls a { border: 1px solid var(--line); border-radius: 999px; padding: 4px 8px; color: var(--ink); text-decoration: none; background: #fff; }
    .lang-controls a.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .current-tabs { display: grid; gap: 14px; }
    .tab-toggle { position: absolute; opacity: 0; pointer-events: none; }
    .tab-labels { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab-label { border: 1px solid var(--line); border-radius: 999px; padding: 8px 12px; background: #fff; color: var(--muted); cursor: pointer; font-weight: 700; }
    .tab-panel { display: none; }
    #current-tab-detail-design:checked ~ .tab-labels label[for="current-tab-detail-design"],
    #current-tab-global-design:checked ~ .tab-labels label[for="current-tab-global-design"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    #current-tab-detail-design:checked ~ .tab-panels #detail-design-panel,
    #current-tab-global-design:checked ~ .tab-panels #global-design-panel { display: block; }
    .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; }
    .three { display: grid; grid-template-columns: 270px minmax(0, 1fr) 340px; gap: 14px; align-items: start; }
    .page-layout { display: grid; grid-template-columns: 280px minmax(0, 1fr) 360px; gap: 14px; align-items: start; }
    .ia-current-shell { display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 430px); gap: 16px; align-items: start; }
    .preview-stage { display: grid; gap: 12px; padding: 16px; }
    .preview-bar { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; }
    .page-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .page-tabs button { border: 1px solid var(--line-strong); background: var(--panel-strong); border-radius: 6px; padding: 8px 11px; color: var(--ink); font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
    .page-tabs button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
    .open-link { border: 1px solid var(--line-strong); background: var(--panel-strong); border-radius: 6px; padding: 8px 11px; color: var(--ink); text-decoration: none; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .route-panel { position: sticky; top: 16px; display: grid; gap: 12px; }
    .ia-flow { display: grid; gap: 8px; }
    .ia-node { display: block; border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel-strong); color: var(--ink); text-decoration: none; }
    .ia-node.active { border-color: var(--ink); background: #f7f2ea; box-shadow: inset 0 0 0 1px var(--ink); }
    .ia-node strong { display: block; font-size: 13px; }
    .ia-node span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; overflow-wrap: anywhere; }
    .ia-arrow { color: var(--muted); text-align: center; font-size: 12px; font-weight: 800; }
    .route-dag { border: 1px solid var(--line); border-radius: 8px; background: linear-gradient(180deg, #fffdfa, #fbf7ef); overflow: hidden; }
    .route-dag svg { display: block; width: 100%; height: auto; }
    .route-actions { display: grid; gap: 6px; margin-top: 8px; }
    .route-actions button { border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--panel-strong); color: var(--ink); text-align: left; font: inherit; font-size: 12px; font-weight: 700; cursor: pointer; }
    .route-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .dag-hit { fill: none; stroke: transparent; stroke-width: 18; pointer-events: stroke; cursor: pointer; }
    .dag-edge { fill: none; stroke: #5a626a; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 10 8; animation: routeFlow 1.5s linear infinite; cursor: pointer; transition: stroke .15s, stroke-width .15s, opacity .15s, filter .15s; pointer-events: stroke; }
    .dag-edge.back { stroke: var(--accent); stroke-dasharray: 6 7; }
    .dag-edge:hover, .dag-edge.hover { stroke: var(--accent); stroke-width: 4; filter: drop-shadow(0 0 5px rgba(184, 66, 46, .25)); }
    .dag-edge.dim, .dag-label.dim, .dag-node.dim { opacity: .28; }
    .dag-node { cursor: pointer; }
    .dag-node rect { fill: #fff; stroke: var(--line-strong); stroke-width: 1.2; rx: 8; transition: stroke .15s, fill .15s, filter .15s; }
    .dag-node text { fill: var(--ink); font-size: 12px; font-weight: 800; }
    .dag-node .dag-sub { fill: var(--muted); font-size: 10px; font-weight: 700; }
    .dag-node.active rect { stroke: var(--ink); fill: #f7f2ea; filter: drop-shadow(0 8px 12px rgba(26, 28, 30, .12)); }
    .dag-node.hover rect { stroke: var(--accent); fill: #fff7f1; }
    .dag-label { pointer-events: auto; cursor: pointer; transition: opacity .15s; }
    .dag-label rect { fill: #fffdfa; stroke: var(--line); rx: 6; }
    .dag-label text { fill: #4a5158; font-size: 10px; font-weight: 700; }
    .dag-marker { fill: #5a626a; }
    .dag-marker.back { fill: var(--accent); }
    @keyframes routeFlow { to { stroke-dashoffset: -36; } }
    .cards { display: grid; gap: 12px; }
    .card { padding: 14px; overflow: hidden; }
    details.card summary { cursor: pointer; list-style-position: inside; }
    details.card summary h2 { display: inline; margin-left: 4px; }
    details.card[open] summary { margin-bottom: 12px; }
    .detail-section { border-top: 1px solid var(--line); padding-top: 10px; }
    .detail-section summary { cursor: pointer; color: var(--ink); font-size: 13px; font-weight: 800; }
    .detail-section[open] summary { margin-bottom: 8px; }
    .contract-block { border: 1px solid var(--line); border-radius: 8px; padding: 10px; background: var(--panel-strong); margin-top: 8px; }
    .contract-block h4 { margin-top: 0; }
    .card.compact { box-shadow: none; background: var(--panel-strong); }
    .card.highlight { border-left: 4px solid var(--accent); }
    .card.ok { border-left: 4px solid var(--ok); background: linear-gradient(90deg, var(--ok-soft), var(--panel) 28%); }
    .card.warn { border-left: 4px solid var(--warn); background: linear-gradient(90deg, var(--warn-soft), var(--panel) 28%); }
    .empty, .waiting { color: var(--muted); padding: 18px; }
    .waiting { max-width: 720px; margin: 48px auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }

    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 5px 9px; color: var(--muted); background: #fbf8f3; font-size: 12px; }
    .chip.strong { color: var(--ink); border-color: var(--line-strong); font-weight: 700; }
    .pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 9px; font-size: 12px; font-weight: 700; }
    .pill.ok { color: var(--ok); background: var(--ok-soft); }
    .pill.warn { color: var(--warn); background: var(--warn-soft); }

    .table { display: grid; border-top: 1px solid var(--line); margin-top: 8px; }
    .row { display: grid; grid-template-columns: minmax(130px, 180px) minmax(0, 1fr); border-bottom: 1px solid var(--line); }
    .row div { padding: 9px; font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
    .row div:first-child { background: #f5f0e8; color: var(--muted); font-weight: 700; }
    .matrix-row { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }

    .style-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
    .style-card { display: grid; gap: 8px; }
    .style-frame { width: 100%; height: 190px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .option-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
    .proposal-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; }
    .preview { width: 100%; height: 360px; border: 1px solid var(--line); border-radius: 8px; background: white; margin-top: 10px; }
    .mini-preview { width: 100%; height: 210px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .focused-preview { width: 100%; height: 620px; border: 1px solid var(--line); border-radius: 8px; background: white; }
    .tree { position: sticky; top: 16px; }
    .tree-list { list-style: none; margin: 6px 0 0; padding: 0; }
    .tree-item { display: block; width: 100%; border: 1px solid var(--line); background: white; border-radius: 8px; padding: 9px; margin: 6px 0; color: var(--ink); }
    .tree .group { margin-top: 12px; color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .token-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
    .token { border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: white; }
    .token strong { display: block; font-size: 12px; color: var(--muted); }
    .token span { overflow-wrap: anywhere; }
    .visual-specimen { display: grid; gap: 14px; font-family: var(--vs-font), Inter, system-ui, sans-serif; color: var(--vs-primary); }
    .specimen-hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 20px; border: 1px solid var(--vs-line); border-radius: 12px; background: var(--vs-surface); box-shadow: var(--shadow); }
    .specimen-hero p { color: var(--vs-secondary); }
    .specimen-eyebrow { margin: 0 0 6px; color: var(--vs-accent); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }
    .specimen-title { margin: 0 0 8px; font-size: 28px; letter-spacing: 0; line-height: 1.15; }
    .specimen-action { border: 0; border-radius: 8px; padding: 10px 14px; background: var(--vs-accent); color: var(--vs-surface); font-weight: 800; }
    .specimen-secondary { border: 1px solid var(--vs-line); border-radius: 8px; padding: 10px 14px; background: var(--vs-surface); color: var(--vs-primary); font-weight: 800; }
    .swatch-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .swatch { min-height: 94px; border: 1px solid var(--vs-line); border-radius: 10px; overflow: hidden; background: var(--vs-surface); }
    .swatch-color { height: 48px; border-bottom: 1px solid rgba(0,0,0,.08); }
    .swatch-body { padding: 8px; }
    .swatch-body strong { display: block; font-size: 12px; color: var(--vs-primary); }
    .swatch-body span { font-size: 12px; color: var(--vs-secondary); overflow-wrap: anywhere; }
    .specimen-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(260px, .9fr); gap: 12px; }
    .specimen-card { border: 1px solid var(--vs-line); border-radius: 10px; padding: 14px; background: var(--vs-surface); }
    .specimen-card.accented { border-left: 4px solid var(--vs-accent); }
    .specimen-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--vs-line); color: var(--vs-secondary); }
    .specimen-row:last-child { border-bottom: 0; }
    .specimen-chip { display: inline-flex; border-radius: 999px; padding: 4px 8px; color: var(--vs-surface); background: var(--vs-success); font-size: 12px; font-weight: 800; }
    .specimen-chip.warn { background: var(--vs-warning); }
    .specimen-chip.error { background: var(--vs-error); }

    @media (max-width: 1100px) {
      main { padding: 16px; }
      .grid, .three, .page-layout, .ia-current-shell, .specimen-grid, .specimen-hero { grid-template-columns: 1fr; }
      .tree, .route-panel { position: static; }
      .preview-bar { display: grid; }
    }
  </style>

      function renderPageSourceSummary(page) {
        return detailsCard(tr('evidenceRefs'), renderPageSourceSummaryBody(page));
      }

      function renderPageTabs(pages, focusedPage) {
        return '<nav class="page-tabs">' + arr(pages).map(function (page) {
          var active = focusedPage && page.pageId === focusedPage.pageId;
          return '<button type="button" class="' + (active ? 'active' : '') + '" data-page="' + esc(page.pageId) + '">' + esc(page.title || page.pageId || tr('page')) + '</button>';
        }).join('') + '</nav>';
      }

      function renderIaFlow(pages, focusedPage) {
        var values = arr(pages);
        if (!values.length) return '<p class="empty">' + esc(tr('noEntries')) + '</p>';
        return '<div class="ia-flow">' + values.map(function (page, index) {
          var active = focusedPage && page.pageId === focusedPage.pageId;
          var node = '<a class="ia-node ' + (active ? 'active' : '') + '" href="' + esc(pageHref(page.pageId)) + '"><strong>' + esc(page.title || page.pageId || tr('page')) + '</strong><span>' + esc(page.route || page.pageId || '') + '</span><span>' + esc(page.purpose || '') + '</span></a>';
          return node + (index < values.length - 1 ? '<div class="ia-arrow">↓</div>' : '');
        }).join('') + '</div>';
      }

      function routeKey(from, to) {
        return String(from || '') + '->' + String(to || '');
      }

      function routeEdges(data, pages) {
        var architecture = obj(data.uiArchitecture);
        var edges = arr(architecture.routeMap);
        if (edges.length) return edges;
        return arr(pages).slice(0, -1).map(function (page, index) {
          return { fromPageId: page.pageId, toPageId: pages[index + 1].pageId, trigger: tr('routeMap') };
        });
      }

      function smokePath(data, pages) {
        var path = arr(obj(data.uiArchitecture).smokePath);
        return path.length ? path : arr(pages).map(function (page) { return page.pageId; });
      }

      function renderRouteDag(data, pages, selected) {
        var ids = [];
        var path = smokePath(data, pages);
        var edges = routeEdges(data, pages);
        var byId = arr(pages).reduce(function (map, page) {
          map[page.pageId] = page;
          return map;
        }, {});
        var x = 58;
        var nodeW = 236;
        var nodeH = 60;
        var gap = 104;
        var w = 420;
        var h;
        var pos;
        var defs;
        var edgeHtml;
        var nodeHtml;
        path.concat(arr(pages).map(function (page) { return page.pageId; })).forEach(function (id) {
          if (id && ids.indexOf(id) === -1) ids.push(id);
        });
        if (!ids.length) return '<p class="empty">' + esc(tr('noEntries')) + '</p>';
        h = 36 + ids.length * gap;
        pos = ids.reduce(function (map, id, index) {
          map[id] = { x: x, y: 24 + index * gap, i: index };
          return map;
        }, {});
        defs = '<defs><marker id="routeArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path class="dag-marker" d="M0,0 L8,3 L0,6 Z"></path></marker><marker id="routeArrowBack" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path class="dag-marker back" d="M0,0 L8,3 L0,6 Z"></path></marker></defs>';
        edgeHtml = edges.map(function (edge, index) {
          var from = edge.fromPageId || edge.from;
          var to = edge.toPageId || edge.to;
          var a = pos[from];
          var b = pos[to];
          var back;
          var marker;
          var d;
          var lx;
          var ly;
          var label;
          if (!a || !b) return '';
          back = b.i <= a.i;
          marker = back ? 'routeArrowBack' : 'routeArrow';
          if (back) {
            var rx = 370;
            var sx = a.x + nodeW;
            var sy = a.y + nodeH / 2;
            var tx = b.x + nodeW;
            var ty = b.y + nodeH / 2;
            d = 'M ' + sx + ' ' + sy + ' C ' + rx + ' ' + sy + ', ' + rx + ' ' + ty + ', ' + tx + ' ' + ty;
            lx = rx - 66;
            ly = (sy + ty) / 2 - 12;
          } else {
            var dsx = a.x + nodeW / 2;
            var dsy = a.y + nodeH;
            var dtx = b.x + nodeW / 2;
            var dty = b.y;
            var mid = (dsy + dty) / 2;
            d = 'M ' + dsx + ' ' + dsy + ' C ' + dsx + ' ' + mid + ', ' + dtx + ' ' + mid + ', ' + dtx + ' ' + dty;
            lx = dtx + 22;
            ly = mid - 12;
          }
          label = shortText(edge.trigger || edge.guard || routeKey(from, to), 18);
          return '<path class="dag-hit" data-dag-route="' + index + '" data-from="' + esc(from) + '" data-to="' + esc(to) + '" onclick="window.__uiSpecDagRoute(this.dataset.dagRoute)" d="' + esc(d) + '"></path><path class="dag-edge ' + (back ? 'back' : '') + '" data-dag-route="' + index + '" data-from="' + esc(from) + '" data-to="' + esc(to) + '" onclick="window.__uiSpecDagRoute(this.dataset.dagRoute)" d="' + esc(d) + '" marker-end="url(#' + marker + ')"><title>' + esc(label) + '</title></path><g class="dag-label" data-dag-route="' + index + '" data-from="' + esc(from) + '" data-to="' + esc(to) + '" onclick="window.__uiSpecDagRoute(this.dataset.dagRoute)" transform="translate(' + Math.max(8, lx) + ' ' + Math.max(8, ly) + ')"><rect width="112" height="22"></rect><text x="56" y="15" text-anchor="middle">' + esc(label) + '</text></g>';
        }).join('');
        nodeHtml = ids.map(function (id, index) {
          var page = byId[id] || { pageId: id };
          var active = selected && selected.pageId === id;
          return '<g class="dag-node ' + (active ? 'active' : '') + '" data-dag-page="' + esc(id) + '" onclick="window.__uiSpecDagPage(this.dataset.dagPage)" transform="translate(' + x + ' ' + pos[id].y + ')"><title>' + esc(id) + '</title><rect width="' + nodeW + '" height="' + nodeH + '"></rect><text x="12" y="25">' + esc(shortText(page.title || page.pageId || id, 24)) + '</text><text class="dag-sub" x="12" y="44">' + String(index + 1).padStart(2, '0') + ' · ' + esc(shortText(page.route || id, 28)) + '</text></g>';
        }).join('');
        return '<div class="route-dag"><svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(tr('routeMap')) + '">' + defs + edgeHtml + nodeHtml + '</svg></div>';
      }

      function renderRouteActions(data, pages) {
        return '<div class="route-actions">' + routeEdges(data, pages).map(function (edge, index) {
          var from = edge.fromPageId || edge.from;
          var to = edge.toPageId || edge.to;
          return '<button type="button" data-dag-route="' + index + '">' + esc(from) + ' → ' + esc(to) + ' · ' + esc(edge.trigger || tr('routeMap')) + '</button>';
        }).join('') + '</div>';
      }

      function renderPreviewStage(page, pages) {
        var preview = page && page.previewFile ? previewPageFrame('focused-preview', page, tr('pagePreview')) : '<p class="empty">' + esc(tr('previewUnavailable')) + '</p>';
        var open = page && page.previewFile ? '<a class="open-link" target="_blank" rel="noopener" href="' + esc(previewPageSrc(page)) + '">' + esc(tr('openPreview')) + '</a>' : '';
        return '<section class="card preview-stage"><div class="preview-bar"><div><h2>' + esc(tr('currentPagePreview')) + ': ' + esc(page && (page.title || page.pageId) || tr('page')) + '</h2><p class="summary">' + esc(page && page.purpose || '') + '</p></div>' + open + '</div>' + renderPageTabs(pages, page) + preview + '</section>';
      }

      function renderComponentSpec(component) {
        return '<article class="card"><h3>' + esc(component.name || component.componentId || tr('component')) + '</h3>' + keyValueTable({
          componentId: component.componentId,
          componentType: component.componentType,
          usage: component.usage
        }) + '<h4>' + esc(tr('variants')) + '</h4>' + chips(component.variants) + '<h4>' + esc(tr('states')) + '</h4>' + chips(component.states) + '<h4>' + esc(tr('tokenRefs')) + '</h4>' + chips(component.tokenRefs) + '<h4>' + esc(tr('keyboardBehavior')) + '</h4>' + list(component.keyboardBehavior) + '<h4>' + esc(tr('accessibility')) + '</h4>' + list(component.accessibility) + '<h4>' + esc(tr('sourceRefsHeading')) + '</h4>' + chips(component.sourceRefs) + '</article>';
      }

      function renderGlobalComponentRule(component) {
        return compactCard(component.name || component.componentId || tr('component'), keyValueTable({
          componentId: component.componentId,
          componentType: component.componentType,
          usage: component.usage
        }) + '<h4>' + esc(tr('variants')) + '</h4>' + chips(component.variants) + '<h4>' + esc(tr('tokenRefs')) + '</h4>' + chips(component.tokenRefs) + '<h4>' + esc(tr('accessibility')) + '</h4>' + list(component.accessibility));
      }

      function renderInteractionSpec(interaction) {
        return compactCard(interaction.interactionId || tr('interaction'), keyValueTable({
          trigger: interaction.trigger,
          target: interaction.target,
          guard: interaction.guard,
          mutation: interaction.mutation,
          successFeedback: interaction.successFeedback,
          failureRecovery: interaction.failureRecovery
        }) + '<h4>' + esc(tr('sourceFlowRefs')) + '</h4>' + chips(interaction.sourceFlowRefs));
      }

      function renderStateSpec(state) {
        return compactCard(state.stateId || tr('state'), keyValueTable({
          stateType: state.stateType,
          surface: state.surface,
          behavior: state.behavior,
          recovery: state.recovery
        }) + '<h4>' + esc(tr('accessibility')) + '</h4>' + list(state.accessibility) + '<h4>' + esc(tr('sourceRefsHeading')) + '</h4>' + chips(state.sourceRefs));
      }

      function contractBlock(title, body) {
        return '<section class="contract-block"><h4>' + esc(title) + '</h4>' + body + '</section>';
      }

      function renderSupportingContractsBody(data, page) {
        var components = findById(data.componentSpecs, 'componentId', page.components);
        var interactions = findById(data.interactionSpecs, 'interactionId', page.interactions);
        var states = findById(data.stateSpecs, 'stateId', page.states);
        return '<h4>' + esc(tr('components')) + '</h4>' + (components.map(function (component) {
          return contractBlock(component.name || component.componentId || tr('component'), keyValueTable({
            componentId: component.componentId,
            componentType: component.componentType,
            usage: component.usage
          }) + chips(component.variants));
        }).join('') || '<p class="empty">' + esc(tr('noEntries')) + '</p>') + '<h4>' + esc(tr('interactions')) + '</h4>' + (interactions.map(function (interaction) {
          return contractBlock(interaction.interactionId || tr('interaction'), keyValueTable({
            trigger: interaction.trigger,
            guard: interaction.guard,
            successFeedback: interaction.successFeedback,
            failureRecovery: interaction.failureRecovery
          }));
        }).join('') || '<p class="empty">' + esc(tr('noEntries')) + '</p>') + '<h4>' + esc(tr('states')) + '</h4>' + (states.map(function (state) {
          return contractBlock(state.stateId || tr('state'), keyValueTable({
            stateType: state.stateType,
            surface: state.surface,
            behavior: state.behavior,
            recovery: state.recovery
          }));
        }).join('') || '<p class="empty">' + esc(tr('noEntries')) + '</p>');
      }

      function renderSupportingContracts(data, page) {
        return detailsCard(tr('supportingContracts'), renderSupportingContractsBody(data, page));
      }

      function traceRefs(title, refs) {
        var entries = Object.entries(obj(refs));
        if (!entries.length) return '';
        return '<h4>' + esc(title) + '</h4>' + entries.map(function (entry) {
          return '<p><strong>' + esc(entry[0]) + '</strong></p>' + chips(entry[1]);
        }).join('');
      }

      function renderTraceabilityEntry(entry) {
        return '<div class="matrix-row"><div><h3>' + esc(entry.uiObjectId || tr('uiObject')) + '</h3><div class="chips">' + chip(entry.type, true) + '</div></div><div><p>' + esc(entry.rationale || '') + '</p>' + traceRefs(tr('upstream'), entry.upstream) + traceRefs(tr('downstream'), entry.downstream) + '<h4>' + esc(tr('risks')) + '</h4>' + list(entry.risks) + '</div></div>';
      }

      function renderVisualSpecimen(visualSystem) {
        var tokens = obj(visualSystem.tokenSummary);
        var primary = cssColor(tokens.primary, '#1A1C1E');
        var secondary = cssColor(tokens.secondary, '#6C7278');
        var accent = cssColor(tokens.accent, '#B8422E');
        var neutral = cssColor(tokens.neutral, '#F7F5F2');
        var surface = cssColor(tokens.surface, '#FFFDFA');
        var success = cssColor(tokens.success, '#1F6B57');
        var warning = cssColor(tokens.warning, '#A66A00');
        var error = cssColor(tokens.error, accent);
        var style = '--vs-primary:' + primary + ';--vs-secondary:' + secondary + ';--vs-accent:' + accent + ';--vs-neutral:' + neutral + ';--vs-surface:' + surface + ';--vs-success:' + success + ';--vs-warning:' + warning + ';--vs-error:' + error + ';--vs-line:color-mix(in srgb, ' + primary + ' 18%, ' + surface + ');--vs-font:' + cssFont(tokens.typography) + ';background:' + neutral + ';padding:14px;border-radius:12px;';
        return '<div class="visual-specimen" style="' + esc(style) + '">' +
          '<section class="specimen-hero"><div><p class="specimen-eyebrow">' + esc(visualSystem.title || visualSystem.styleId || tr('visualSystem')) + '</p><h3 class="specimen-title">账单调整请求 SUP-1042</h3><p>紧凑企业界面，用暖中性色承载长时间工作区，并把证据、负责人和下一步动作放在同一视野内。</p></div><div class="chips"><button class="specimen-action">复核并提交</button><button class="specimen-secondary">保存草稿</button></div></section>' +
          renderColorSwatches(tokens) +
          '<section class="specimen-grid"><article class="specimen-card accented"><h3>证据就绪度</h3><div class="specimen-row"><span>发票截图</span><span class="specimen-chip">已完成</span></div><div class="specimen-row"><span>付款参考号</span><span class="specimen-chip warn">缺失</span></div><div class="specimen-row"><span>政策校验</span><span class="specimen-chip error">需复核</span></div></article><article class="specimen-card"><h3>负责人和 SLA</h3><p style="color:var(--vs-secondary)">负责人：账单支持队列</p><p style="color:var(--vs-secondary)">预计更新：1 个工作日内</p><div class="specimen-row"><span>主操作</span><strong style="color:var(--vs-accent)">克制强调</strong></div><div class="specimen-row"><span>卡片圆角</span><strong>' + esc(tokens.radius || '8px') + '</strong></div><div class="specimen-row"><span>间距节奏</span><strong>' + esc(tokens.spacing || '8px') + '</strong></div></article></section>' +
          '</div>';
      }

      function renderVisualSystem(data) {
        var visualSystem = obj(data.visualSystem);
        return card(tr('visualSystem'), renderVisualSpecimen(visualSystem) + '<h4>' + esc(tr('tokenSummary')) + '</h4>' + renderTokenSummary(visualSystem.tokenSummary) + keyValueTable({
          styleId: visualSystem.styleId,
          title: visualSystem.title,
          sourceType: visualSystem.sourceType,
          designMdRef: visualSystem.designMdRef,
          designSystemRef: visualSystem.designSystemRef
        }) + '<h4>' + esc(tr('applicationRules')) + '</h4>' + list(visualSystem.applicationRules));
      }

      function renderGlobalDesignTab(data) {
        var components = arr(data.componentSpecs);
        return '<div class="cards">' +
          renderVisualSystem(data) +
          card(tr('keyboardBehavior'), components.map(function (component) { return compactCard(component.name || component.componentId || tr('component'), list(component.keyboardBehavior)); }).join('')) +
          card(tr('sharedComponentRules'), components.map(renderGlobalComponentRule).join('')) +
          card(tr('evidenceRefs'), chips(data.evidenceRefs)) +
          '</div>';
      }

      function renderDetailDesignTab(data, pages, focusedPage) {
        focusedPage = focusedPage || pages[0] || {};
        var traceabilityMatrix = arr(data.traceabilityMatrix);
        return '<div class="ia-current-shell">' +
          renderPreviewStage(focusedPage, pages) +
          '<aside class="card route-panel"><h2>' + esc(tr('uiArchitecture')) + '</h2>' + keyValueTable(data.uiArchitecture) + '<h3>' + esc(tr('routeMap')) + '</h3>' + renderRouteDag(data, pages, focusedPage) + renderRouteActions(data, pages) + '<h3>' + esc(tr('selectedPageContract')) + '</h3>' + keyValueTable({
            pageId: focusedPage.pageId,
            workspaceId: focusedPage.workspaceId,
            route: focusedPage.route,
            pageType: focusedPage.pageType,
            purpose: focusedPage.purpose,
            sourceFile: focusedPage.sourceFile
          }) + '<h4>' + esc(tr('layout')) + '</h4>' + keyValueTable(focusedPage.layout) + '<h4>' + esc(tr('components')) + '</h4>' + chips(focusedPage.components) + '<h4>' + esc(tr('states')) + '</h4>' + chips(focusedPage.states) + '<h4>' + esc(tr('interactions')) + '</h4>' + chips(focusedPage.interactions) + '<h4>' + esc(tr('accessibility')) + '</h4>' + list(focusedPage.accessibility) + inlineDetails(tr('supportingContracts'), renderSupportingContractsBody(data, focusedPage)) + inlineDetails(tr('evidenceRefs'), renderPageSourceSummaryBody(focusedPage)) + inlineDetails(tr('traceability'), traceabilityMatrix.map(renderTraceabilityEntry).join('')) + inlineDetails(tr('reviewRecord'), keyValueTable(data.decisionTrace)) + '<h3>' + esc(tr('implementationNotes')) + '</h3>' + list(data.openRisks) + '</aside>' +
          '</div>';
      }

      function renderCurrent(data) {
        var pages = arr(data.pageSpecs);
        var focusedPage = pages.find(function (page) { return page.pageId === selectedPageId; }) || pages[0] || {};

        var body = '<div class="current-tabs">' +
          '<input class="tab-toggle" type="radio" name="current-tab" id="current-tab-detail-design" checked>' +
          '<input class="tab-toggle" type="radio" name="current-tab" id="current-tab-global-design">' +
          '<div class="tab-labels" role="tablist"><label class="tab-label" role="tab" for="current-tab-detail-design">' + esc(tr('detailDesignTab')) + '</label><label class="tab-label" role="tab" for="current-tab-global-design">' + esc(tr('globalDesignTab')) + '</label></div>' +
          '<div class="tab-panels"><section class="tab-panel" id="detail-design-panel" role="tabpanel">' + renderDetailDesignTab(data, pages, focusedPage) + '</section><section class="tab-panel" id="global-design-panel" role="tabpanel">' + renderGlobalDesignTab(data) + '</section></div>' +
          '</div>';
        return shell(tr('currentTitle'), tr('currentSummary'), 'current_ui_spec', data, body);
      }

      function setDagRouteHover(from, to, on) {
        document.querySelectorAll('.dag-edge,.dag-label').forEach(function (element) {
          var hit = element.dataset.from === from && element.dataset.to === to;
          element.classList.toggle('hover', on && hit);
          element.classList.toggle('dim', on && !hit);
        });
        document.querySelectorAll('.dag-node').forEach(function (element) {
          var hit = element.dataset.dagPage === from || element.dataset.dagPage === to;
          element.classList.toggle('hover', on && hit);
          element.classList.toggle('dim', on && !hit);
        });
      }

      function setDagNodeHover(id, on) {
        document.querySelectorAll('.dag-edge,.dag-label').forEach(function (element) {
          var hit = element.dataset.from === id || element.dataset.to === id;
          element.classList.toggle('hover', on && hit);
          element.classList.toggle('dim', on && !hit);
        });
        document.querySelectorAll('.dag-node').forEach(function (element) {
          var hit = element.dataset.dagPage === id;
          element.classList.toggle('hover', on && hit);
          element.classList.toggle('dim', on && !hit);
        });
      }

      function bindCurrentInteractions(data) {
        var pages = arr(data.pageSpecs);
        var edges = routeEdges(data, pages);
        window.__uiSpecDagRoute = function (routeIndex) {
          var edge = edges[Number(routeIndex)];
          if (!edge) return;
          setSelectedPage(edge.toPageId || edge.to, edge.queryParams);
        };
        window.__uiSpecDagPage = function (pageId) {
          setSelectedPage(pageId);
        };
        document.querySelectorAll('[data-page]').forEach(function (element) {
          element.addEventListener('click', function () {
            setSelectedPage(element.dataset.page);
          });
        });
        document.querySelectorAll('[data-dag-route]').forEach(function (element) {
          element.addEventListener('click', function () {
            var edge = edges[Number(element.dataset.dagRoute)];
            if (!edge) return;
            setSelectedPage(edge.toPageId || edge.to, edge.queryParams);
          });
          element.addEventListener('mouseenter', function () { setDagRouteHover(element.dataset.from, element.dataset.to, true); });
          element.addEventListener('mouseleave', function () { setDagRouteHover(element.dataset.from, element.dataset.to, false); });
        });
        document.querySelectorAll('[data-dag-page]').forEach(function (element) {
          element.addEventListener('click', function () { setSelectedPage(element.dataset.dagPage); });
          element.addEventListener('mouseenter', function () { setDagNodeHover(element.dataset.dagPage, true); });
          element.addEventListener('mouseleave', function () { setDagNodeHover(element.dataset.dagPage, false); });
        });
      }

      function detectMode(data, explicitMode) {
        var mode = String(explicitMode || '').toLowerCase();
        if (mode === 'raw_inputs' || mode === 'raw-inputs') return 'raw_inputs';
        if (mode === 'exploration_review' || mode === 'exploration-review') return 'exploration_review';
        if (mode === 'current_ui_spec' || mode === 'current-ui-spec') return 'current_ui_spec';
        if (data.kind === 'UISpecRaw' || data.layer === 'Raw') return 'raw_inputs';
        if (data.kind === 'UISpecExploration' || data.layer === 'Exploration') return 'exploration_review';
        if (data.kind === 'UISpecCurrent' || data.layer === 'Current') return 'current_ui_spec';
        return 'current_ui_spec';
      }

      function render(data, explicitMode) {
        var mode = detectMode(data, explicitMode);
        currentRenderData = data;
        if (mode === 'raw_inputs') root.innerHTML = renderRaw(data);
        else if (mode === 'exploration_review') root.innerHTML = renderExploration(data);
        else {
          root.innerHTML = renderCurrent(data);
          bindCurrentInteractions(data);
        }
      }

      function parseResource(input) {
        var envelope = input && input.resource ? input.resource : input;
        var raw = envelope && Object.prototype.hasOwnProperty.call(envelope, 'content') ? envelope.content : envelope;
        if (typeof raw === 'string') return JSON.parse(raw);
        if (raw && typeof raw === 'object') return raw;
        throw new Error(tr('resourceMissing'));
      }

      function showError(error) {
        root.innerHTML = '<div class="waiting"><strong>' + esc(tr('unableToRender')) + '</strong><p>' + esc(error && error.message ? error.message : error) + '</p></div>';
      }

      async function loadDemo(name) {
        var key = normalizeDemoName(name);
        var demoFile = resolveDemoFile(demoFiles[key]);
        var response = await fetch(demoFile, { cache: 'no-store' });
        if (!response.ok) throw new Error(tr('loadDemoError') + demoFile);
        render(await response.json());
      }

      window.addEventListener('message', function (event) {
        if (event.data && event.data.type === 'acas-ui-spec-navigate') {
          if (event.origin !== 'null' && event.origin !== window.location.origin) return;
          setSelectedPage(event.data.pageId, event.data.params);
          return;
        }
        if (event.source !== window.parent && event.source !== window) return;
        if (event.origin !== 'null' && event.origin !== window.location.origin) return;
        if (!event.data || event.data.type !== 'acas-render-resource') return;
        try {
          render(parseResource(event.data), event.data.mode || event.data.renderMode);
        } catch (error) {
          showError(error);
        }
      });

      var params = new URLSearchParams(location.search);
      currentLang = currentLanguage(params.get('lang'));
      document.documentElement.lang = currentLang;
      root.innerHTML = '<div class="waiting">' + esc(tr('waiting')) + '</div>';
      selectedPageId = String(params.get('page') || '').trim();
      selectedStyleId = String(params.get('style') || '').trim();
      var demo = params.get('demo') || params.get('layer');
      if (demo) {
        loadDemo(demo).catch(showError);
      } else if (window.__ACAS_RENDER_RESOURCE__) {
        try {
          render(parseResource(window.__ACAS_RENDER_RESOURCE__), window.__ACAS_RENDER_MODE__);
        } catch (error) {
          showError(error);
        }
      }
    })();
  </script>
</body>
</html>
