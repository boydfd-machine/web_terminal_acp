<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ACAS Low-fi Prototype Renderer</title>
  <style>
    :root{--ink:#1A1C1E;--slate:#6C7278;--clay:#B8422E;--limestone:#F7F5F2;--panel:#FFFDFA;--line:#DDD6CC;--line-strong:#BFB6AA;--soft:#EEE8DF;--focus:#7F2E21;font-family:"Public Sans",Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--limestone)}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;background:linear-gradient(180deg,#fffaf2 0%,var(--limestone) 42%,#eee7dc 100%)}.shell{width:min(1680px,94vw);margin:0 auto;display:grid;gap:16px}
    .top,.card,.edge,.preview{border:1px solid var(--line);border-radius:8px;background:rgba(255,253,250,.94);box-shadow:0 16px 40px rgba(26,28,30,.07)}
    .top{padding:18px 20px;border-top:4px solid var(--clay);background:linear-gradient(135deg,#fffdfa 0%,#f3ece2 100%)}.bar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
    h1,h2,h3,h4,p{margin:0}h1{font-size:22px;line-height:1.2;font-weight:720}h2{font-size:15px;line-height:1.3;font-weight:720}h3,h4{font-size:13px;line-height:1.35;font-weight:720}p,li,td,th{font-size:12px;line-height:1.55;color:#34383C}
    #root>h2{margin:8px 0 -4px;font-size:12px;color:var(--slate);text-transform:uppercase}.muted{color:var(--slate)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
    .card{padding:14px;display:grid;gap:10px;align-content:start}.recommended{border-color:var(--clay);box-shadow:inset 0 0 0 1px var(--clay),0 18px 42px rgba(184,66,46,.12)}
    .chips,.actions{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:6px;padding:4px 7px;background:#F7F2EA;color:#42474C;font-size:11px;font-weight:700}
    button,a.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:6px;padding:7px 10px;color:var(--ink);text-decoration:none;cursor:pointer;font:inherit;font-size:12px;font-weight:700;transition:background .15s ease,border-color .15s ease,color .15s ease,transform .15s ease}
    button:hover,a.btn:hover{border-color:var(--clay);color:var(--clay);transform:translateY(-1px)}button.active,a.btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .edge{padding:10px 12px;display:grid;gap:4px;background:#FBF8F3}.edge strong{font-size:12px;color:var(--ink)}iframe{width:100%;height:560px;border:1px solid var(--line-strong);border-radius:8px;background:#fff}
    .preview{padding:14px;display:grid;gap:12px}table{width:100%;border-collapse:collapse}td,th{border-top:1px solid var(--soft);text-align:left;padding:7px 6px;vertical-align:top}th{width:34%;color:var(--slate);font-weight:700}.empty{border:1px dashed var(--line-strong);border-radius:8px;padding:14px;color:var(--slate);background:#FBF8F3}
    .current-shell{display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,430px);gap:16px;align-items:start}.prototype-stage{min-height:0}.preview.primary{padding:16px}.page-tabs,.proposal-tabs{display:flex;gap:8px;flex-wrap:wrap}.page-tabs button{padding:8px 11px}.proposal-tabs button{min-width:190px;text-align:left}.proposal-tabs small{display:block;color:var(--slate);font-size:10px;margin-top:3px}.preview.primary iframe{height:min(72vh,760px);min-height:560px}.route-panel{position:sticky;top:16px}.route-panel h2{font-size:15px}.route-dag{border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,#fffdfa,#fbf7ef);overflow:hidden}.route-dag.compact{max-width:260px}.route-dag svg{display:block;width:100%;height:auto}.dag-hit{fill:none;stroke:transparent;stroke-width:18;pointer-events:stroke;cursor:pointer}.dag-edge{fill:none;stroke:#5a626a;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:10 8;animation:routeFlow 1.5s linear infinite;cursor:pointer;transition:stroke .15s,stroke-width .15s,opacity .15s,filter .15s;pointer-events:stroke}.dag-edge.back{stroke:var(--clay);stroke-dasharray:6 7}.dag-edge:hover,.dag-edge.hover{stroke:var(--clay);stroke-width:4;filter:drop-shadow(0 0 5px rgba(184,66,46,.25))}.dag-edge.dim{opacity:.18}.dag-edge.change-add{stroke:#23714d}.dag-edge.change-modify{stroke:#a66a00}.dag-edge.change-delete{stroke:#8f1f14}.dag-node{cursor:pointer}.dag-node rect{fill:#fff;stroke:var(--line-strong);stroke-width:1.2;rx:8;transition:stroke .15s,fill .15s,filter .15s}.dag-node text{fill:var(--ink);font-size:12px;font-weight:800}.dag-node .dag-sub{fill:var(--slate);font-size:10px;font-weight:700}.dag-status{font-size:10px;font-weight:900;fill:#fff}.dag-status-bg.add{fill:#23714d}.dag-status-bg.modify{fill:#a66a00}.dag-status-bg.delete{fill:#8f1f14}.dag-node.active rect{stroke:var(--ink);fill:#f7f2ea;filter:drop-shadow(0 8px 12px rgba(26,28,30,.12))}.dag-node.hover rect{stroke:var(--clay);fill:#fff7f1}.dag-node.dim{opacity:.38}.dag-node.change-add rect{stroke:#23714d;background:#edf6ef}.dag-node.change-modify rect{stroke:#a66a00;fill:#fff8df}.dag-node.change-delete rect{stroke:#8f1f14;fill:#fff1ea}.dag-label{pointer-events:auto;cursor:pointer;transition:opacity .15s}.dag-label.dim{opacity:.18}.dag-label rect{fill:#fffdfa;stroke:var(--line);rx:6}.dag-label text{fill:#4a5158;font-size:10px;font-weight:700}.dag-marker{fill:#5a626a}.dag-marker.back{fill:var(--clay)}.exp-workbench{display:grid;grid-template-columns:270px minmax(0,1fr) 380px;gap:16px;align-items:start}.change-panel{position:sticky;top:16px}.change-panel h2+section{margin-top:8px}.question-list{display:grid;gap:10px}.question-card{border:1px solid var(--line);border-radius:8px;background:#fffdfa;padding:10px}.question-card h3{font-size:12px;margin-bottom:5px}.change-list{display:grid;gap:8px}.change-card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px;display:grid;gap:6px}.change-card h3{font-size:13px}.change-card p{margin:0}.change-card.add{border-left:5px solid #23714d}.change-card.modify{border-left:5px solid #a66a00}.change-card.delete{border-left:5px solid #8f1f14}.badge{display:inline-flex;width:max-content;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:800;text-transform:uppercase}.badge.add{background:#e8f2ed;color:#23714d}.badge.modify{background:#fff4cf;color:#8a5c00}.badge.delete{background:#ffe5df;color:#8f1f14}.diff{display:grid;grid-template-columns:1fr 1fr;gap:8px}.diff>div{border:1px solid var(--line);border-radius:8px;background:#fbf8f3;padding:7px}.diff b{display:block;font-size:10px;text-transform:uppercase;color:var(--slate);margin-bottom:3px}.html-compare{display:grid;gap:10px}.html-compare .preview{padding:12px}.html-compare iframe{height:clamp(160px,23vh,320px);min-height:0}.compare-label{display:flex;align-items:center;justify-content:space-between;gap:8px}@keyframes routeFlow{to{stroke-dashoffset:-36}}
    body.is-preview{padding:16px;background:#f4f0e8}.is-preview .shell{width:min(1900px,98vw)}.preview-mode{height:calc(100vh - 32px);display:grid;grid-template-rows:auto 1fr;gap:12px}.preview-toolbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;border:1px solid var(--line);border-radius:8px;background:rgba(255,253,250,.96);padding:10px 12px}.preview-toolbar h1{font-size:16px}.preview-toolbar .page-tabs{justify-content:center}.preview-pair{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview-pane{min-height:0;display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:8px;background:#fffdfa;box-shadow:0 18px 40px rgba(26,28,30,.08);overflow:hidden}.preview-pane h2{padding:10px 12px;border-bottom:1px solid var(--line);background:#fbf7ef}.preview-pane iframe{height:100%;min-height:0;border:0;border-radius:0}
    ul{margin:0;padding-left:17px}section.grid+section.grid{margin-top:2px}@media(max-width:720px){body{padding:14px}.shell{width:100%}.bar{display:grid}.grid{grid-template-columns:1fr}iframe{height:520px}}
    @media(max-width:1100px){.exp-workbench{grid-template-columns:1fr}.route-dag.compact{max-width:none}.mini-preview iframe{height:620px}.current-shell{grid-template-columns:1fr}.route-panel{position:static}.preview.primary iframe{height:620px}}
  </style>
</head>
<body>
  <main id="root" class="shell"></main>
  <script>
    const qs=new URLSearchParams(location.search);
    const I18N={
      zh:{raw:'低保真原型 Raw',exploration:'低保真原型 Exploration',current:'低保真原型 Current',constraints:'约束',signals:'原型信号',questions:'问题',options:'页面集方案',recommended:'推荐',routeMap:'路由图',smoke:'冒烟路径',pages:'页面',preview:'HTML 页面预览',previewMode:'预览模式',exitPreview:'退出预览',open:'打开页面',tokens:'Token 预算',data:'内容数据',jump:'跳转',waiting:'等待 ACAS 低保真原型数据',baseline:'现有路径',local:'本轮局部原型',changes:'本轮改动',before:'已有 HTML 预览',after:'调整后 HTML 预览',notes:'对比说明',proposals:'本轮 Proposals',impact:'路径影响'},
      en:{raw:'Low-fi Prototype Raw',exploration:'Low-fi Prototype Exploration',current:'Low-fi Prototype Current',constraints:'Constraints',signals:'Prototype signals',questions:'Questions',options:'Page-set options',recommended:'recommended',routeMap:'Route map',smoke:'Smoke path',pages:'Pages',preview:'HTML page preview',previewMode:'Preview mode',exitPreview:'Exit preview',open:'Open page',tokens:'Token budget',data:'Content data',jump:'Jump',waiting:'Waiting for ACAS low-fi prototype data',baseline:'Existing path',local:'Iteration prototype',changes:'Iteration changes',before:'Existing HTML preview',after:'Adjusted HTML preview',notes:'Comparison notes',proposals:'Proposals',impact:'Path impact'}
    };
    const state={lang:qs.get('lang')||'zh',data:null,pageId:qs.get('page')||null,proposalId:qs.get('proposal')||null,dataId:qs.get('data')||null,preview:qs.get('view')==='preview'||qs.get('mode')==='preview'||qs.get('preview')==='1',params:{}};
    function tr(k){return (I18N[state.lang]&&I18N[state.lang][k])||k}
    function loc(v){return v&&typeof v==='object'&&!Array.isArray(v)?(v[state.lang]||v.zh||v.en||''):v}
    function esc(v){return String(loc(v)??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function arr(v){return Array.isArray(v)?v:[]}
    function ul(items){const xs=arr(items).map(loc).filter(Boolean);return xs.length?`<ul>${xs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
    function chips(items){return `<div class="chips">${arr(items).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}</div>`}
    function assetPath(path){return (location.pathname.includes('/renderers/')?'../':'')+path}
    function paramString(page){
      const params={...(page.defaultParams||{}),...state.params,lang:state.lang,page:page.pageId};
      if(state.dataId)params.data=state.dataId;
      return new URLSearchParams(Object.entries(params).filter(([,v])=>v!==undefined&&v!==null).map(([k,v])=>[k,String(v)])).toString();
    }
    function pageSrc(page){const sep=page.htmlFile.includes('?')?'&':'?';return assetPath(page.htmlFile)+sep+paramString(page)}
    function parseResource(r){if(!r)return null;if(typeof r.content==='string'){try{return JSON.parse(r.content)}catch{return {kind:'LowFiPrototypeCurrent',pageSet:{testQuestion:r.content,pages:[],routeMap:[],smokePath:[]}}}}return r.content||r}
    function mode(d){if(d.kind==='LowFiPrototypeRaw'||d.layer==='Raw'||d.prototypeSignals)return'raw';if(d.kind==='LowFiPrototypeExploration'||d.layer==='Exploration'||d.pageSetOptions)return'exploration';return'current'}
    function header(title,refs,extra=''){
      return `<section class="top"><div class="bar"><div><h1>${esc(title)}</h1><p class="muted">${esc(refs||'')}</p></div><div class="actions"><button data-lang="zh" class="${state.lang==='zh'?'active':''}">中文</button><button data-lang="en" class="${state.lang==='en'?'active':''}">English</button></div></div>${extra}</section>`;
    }
    function bindLang(){document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;render(state.data)})}
    function bindPages(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.pageId=b.dataset.page;render(state.data)})}
    function bindPreview(){document.querySelectorAll('[data-preview-mode]').forEach(b=>b.onclick=()=>{state.preview=b.dataset.previewMode==='on';const u=new URL(location.href);if(state.preview)u.searchParams.set('view','preview');else{u.searchParams.delete('view');u.searchParams.delete('mode');u.searchParams.delete('preview')}history.replaceState(null,'',u);render(state.data)})}
    function row(k,v){return `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`}
    function short(v,n=30){const s=String(loc(v)??'');return s.length>n?s.slice(0,n-1)+'...':s}
    function pageTitle(p){return loc(p&&p.title)||p?.pageId||''}
    function routeEdges(edges, clickable=false){
      return arr(edges).map((e,i)=>`<div class="edge"><strong>${esc(e.fromPageId||e.from)} -> ${esc(e.toPageId||e.to)}</strong><p>${esc([loc(e.trigger),e.guard].filter(Boolean).join(' · '))}</p>${clickable?`<button data-route="${i}">${tr('jump')}</button>`:''}</div>`).join('')||`<div class="empty">${tr('routeMap')}</div>`;
    }
    function routeKey(from,to){return `${from}->${to}`}
    function routeDag(ps,pages,selected,meta={}){
      const pageStatus=meta.pageStatus||{},routeStatus=meta.routeStatus||{},isStatic=!!meta.static;
      const ids=[...new Set(arr(ps.smokePath).concat(arr(pages).map(p=>p.pageId),Object.keys(pageStatus)).filter(Boolean))];
      const byId=Object.fromEntries(arr(meta.extraPages).concat(arr(pages)).map(p=>[p.pageId,p]));
      if(!ids.length)return `<div class="empty">${tr('routeMap')}</div>`;
      const compact=!!meta.compact, x=compact?28:58,nodeW=compact?150:236,nodeH=compact?44:60,gap=compact?64:104,w=compact?240:420,h=(compact?26:36)+ids.length*gap;
      const pos=Object.fromEntries(ids.map((id,i)=>[id,{x,y:24+i*gap,i}]));
      const defs=`<defs><marker id="routeArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path class="dag-marker" d="M0,0 L8,3 L0,6 Z"/></marker><marker id="routeArrowBack" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path class="dag-marker back" d="M0,0 L8,3 L0,6 Z"/></marker></defs>`;
      const edges=arr(ps.routeMap).map((e,i)=>{
        const from=e.fromPageId||e.from,to=e.toPageId||e.to,a=pos[from],b=pos[to];if(!a||!b)return'';
        const back=b.i<=a.i,marker=back?'routeArrowBack':'routeArrow',status=routeStatus[routeKey(from,to)]||'';
        let d,lx,ly;
        if(back){const rx=compact?w-24:370,sx=a.x+nodeW,sy=a.y+nodeH/2,tx=b.x+nodeW,ty=b.y+nodeH/2;d=`M ${sx} ${sy} C ${rx} ${sy}, ${rx} ${ty}, ${tx} ${ty}`;lx=rx-66;ly=(sy+ty)/2-12}
        else{const sx=a.x+nodeW/2,sy=a.y+nodeH,tx=b.x+nodeW/2,ty=b.y;const mid=(sy+ty)/2;d=`M ${sx} ${sy} C ${sx} ${mid}, ${tx} ${mid}, ${tx} ${ty}`;lx=tx+22;ly=mid-12}
        const label=short(e.trigger||e.guard||'',18);
        const action=isStatic?'':`data-dag-route="${i}"`;
        return `<path class="dag-hit" ${action} data-from="${esc(from)}" data-to="${esc(to)}" d="${d}"></path><path class="dag-edge ${back?'back':''} ${status?`change-${status}`:''}" ${action} data-from="${esc(from)}" data-to="${esc(to)}" d="${d}" marker-end="url(#${marker})"><title>${esc(label||`${from} -> ${to}`)}</title></path>${label?`<g class="dag-label" ${action} data-from="${esc(from)}" data-to="${esc(to)}" transform="translate(${Math.max(8,lx)} ${Math.max(8,ly)})"><rect width="112" height="22"></rect><text x="56" y="15" text-anchor="middle">${esc(label)}</text></g>`:''}`;
      }).join('');
      const nodes=ids.map((id,i)=>{const p=byId[id]||{pageId:id},active=selected&&selected.pageId===id,status=pageStatus[id]||'',mark=status==='add'?'C':status==='modify'?'U':status==='delete'?'D':'';return `<g class="dag-node ${active?'active':''} ${status?`change-${status}`:''}" ${isStatic?'':`data-dag-page="${esc(id)}"`} transform="translate(${x} ${pos[id].y})"><title>${esc(id)}</title><rect width="${nodeW}" height="${nodeH}"></rect><text x="12" y="${compact?20:25}">${esc(short(pageTitle(p),compact?15:24))}</text><text class="dag-sub" x="12" y="${compact?35:44}">${String(i+1).padStart(2,'0')}</text>${mark?`<circle class="dag-status-bg ${esc(status)}" cx="${nodeW-16}" cy="16" r="11"></circle><text class="dag-status" x="${nodeW-16}" y="20" text-anchor="middle">${mark}</text>`:''}</g>`}).join('');
      return `<div class="route-dag ${compact?'compact':''}"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(tr('routeMap'))}">${defs}${edges}${nodes}</svg></div>`;
    }
    function renderRaw(d){
      const s=d.prototypeSlice||{}, c=d.prototypeConstraints||{};
      root.innerHTML=`
        ${header(tr('raw'),[d.sourceJourneyRef,d.sourceFlowRef].filter(Boolean).join(' · '),chips(s.coveredFlowNodes))}
        <section class="grid">
          <article class="card"><h2>Slice</h2><table>${row('actor',s.actor)}${row('scenario',s.scenario)}${row('trigger',s.trigger)}${row('outcome',s.outcome)}</table></article>
          <article class="card"><h2>${tr('constraints')}</h2><table>${row('oneHtmlFilePerPage',c.oneHtmlFilePerPage)}${row('routingStyle',c.routingStyle)}${row('maxPageCount',c.maxPageCount)}${row('maxHtmlTokensPerPage',c.maxHtmlTokensPerPage)}${row('styleFidelity',c.styleFidelity)}</table></article>
        </section>
        <h2>${tr('signals')}</h2><section class="grid">${arr(d.prototypeSignals).map(s=>`<article class="card"><h3>${esc(s.signalId)}</h3><p class="muted">${esc(s.signalType)}</p><p>${esc(s.implication)}</p>${chips(s.sourceRefs)}${ul(s.contentNeeds)}${chips(s.contentSlots)}${ul(s.constraints)}${ul(s.unknowns)}</article>`).join('')}</section>
        <h2>${tr('data')}</h2><section class="grid">${arr(d.contentDataNeeds).map(x=>`<article class="card"><h3>${esc(x.dataId)}</h3><p>${esc(x.purpose)}</p>${chips(x.consumerSignalIds)}${chips(x.exampleFields)}<p class="muted">${esc(x.sourceRef||'')}</p></article>`).join('')}</section>
        <h2>${tr('questions')}</h2><section class="grid">${arr(d.designQuestions).map(q=>`<article class="card"><h3>${esc(q.questionId)}</h3><p>${esc(q.question)}</p><p class="muted">${esc(q.whyItMatters)}</p>${chips(q.sourceRefs)}</article>`).join('')}</section>`;
    }
    function changeMaps(changes){
      const pageStatus={},routeStatus={};
      arr(changes).forEach(c=>{
        const t=c.changeType;
        if(c.targetType==='route'&&String(c.targetId||'').includes('->')){
          routeStatus[c.targetId]=t;
          const [from,to]=String(c.targetId).split('->');
          if(from&&!pageStatus[from])pageStatus[from]='modify';
          if(to&&!pageStatus[to])pageStatus[to]='modify';
        }
        if(c.targetType==='page'&&c.targetId)pageStatus[c.targetId]=t;
        if((c.targetType==='content'||c.targetType==='element'||c.targetType==='state'||c.targetType==='data_slot')&&c.pageId)pageStatus[c.pageId]=t;
      });
      return{pageStatus,routeStatus};
    }
    function changeCard(c){
      return `<article class="change-card ${esc(c.changeType)}"><span class="badge ${esc(c.changeType)}">${esc(c.changeType)}</span><h3>${esc(c.targetId)}</h3><p>${esc(c.summary)}</p>${(c.before||c.after)?`<div class="diff"><div><b>${tr('before')}</b><p>${esc(c.before||'-')}</p></div><div><b>${tr('after')}</b><p>${esc(c.after||'-')}</p></div></div>`:''}${chips(c.diffHighlights)}${chips(c.sourceRefs)}</article>`;
    }
    function proposalSetOf(d){
      if(d.proposalSet)return d.proposalSet;
      const it=d.iterationProposal||{}, p={proposalId:it.iterationId||'proposal_1',title:it.title||it.iterationId,goal:it.goal,recommendation:'recommended',localPrototype:it.localPrototype||{},changes:it.changes||[],comparisonNotes:it.comparisonNotes||[],validationTasks:it.validationTasks||[]};
      return{proposalSetId:it.iterationId||'proposal_set',title:it.title,goal:it.goal,baseCurrentRef:it.baseCurrentRef,recommendedProposalId:p.proposalId,baseline:it.baseline||{},proposals:[p]};
    }
    function proposalTitle(p){return loc(p&&p.title)||p?.proposalId||''}
    function selectedProposal(set){return arr(set.proposals).find(p=>p.proposalId===state.proposalId)||arr(set.proposals).find(p=>p.proposalId===set.recommendedProposalId)||arr(set.proposals)[0]||{}}
    function bindProposals(set){document.querySelectorAll('[data-proposal]').forEach(b=>b.onclick=()=>{state.proposalId=b.dataset.proposal;state.pageId=null;state.params={};render(state.data)})}
    function pageWithVariant(page,variant){
      if(!page)return null;
      const p={...page,defaultParams:{...(page.defaultParams||{})}};
      if(variant)p.defaultParams.variant=variant;
      return p;
    }
    function htmlCompare(beforePage,afterPage,pages=[]){
