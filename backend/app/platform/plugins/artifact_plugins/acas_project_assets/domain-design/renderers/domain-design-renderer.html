    .code-block{white-space:pre-wrap;word-break:break-word;max-height:190px;overflow:auto;background:#27231d;color:#fbf4e8;border-radius:10px;padding:10px;font-size:11px;line-height:1.45}.trace{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.trace-item{border:1px solid var(--line);border-radius:12px;background:#fffdf8;padding:12px;display:grid;gap:7px}.readiness{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:9px}.readiness .list-card{align-content:start}
    .waiting,.error{border:1px dashed var(--line);border-radius:14px;background:var(--paper);padding:18px;color:var(--muted);box-shadow:var(--shadow)}.error{border-color:#e8b6ad;color:#8f2f22;background:#fff4f1}
    @media(max-width:1080px){.grid{grid-template-columns:1fr}.span-3,.span-4,.span-5,.span-6,.span-7,.span-8,.span-9,.span-12{grid-column:1}.inspector{position:static}.relationship-row,.row{grid-template-columns:1fr}.relationship-row.head,.row.head{display:none}.two-col,.three-col,.domain-graph,.exploration-layout{grid-template-columns:1fr}.bar{display:grid}}
  </style>

              t=halfH/absDy;
            }
            const boundaryDist=dist*t;
            const effDist=boundaryDist+gap;
            const factor=effDist/dist;
            return {x:cx+dx*factor,y:cy+dy*factor};
          }
        }

        edges.forEach(edge=>{
          const a=positions[edge.source],b=positions[edge.target];
          if(!a||!b)return;
          const s=anchor(a,b,nodes[edge.source].type==='event',false),
                tgt=anchor(b,a,nodes[edge.target].type==='event',true);
          const midX=(s.x+tgt.x)/2;
          const path='M'+s.x+' '+s.y+' C '+midX+' '+s.y+' '+midX+' '+tgt.y+' '+tgt.x+' '+tgt.y;
          const markerId=edge.kind==='produce'?'arrowProduce':'arrowConsume';
          pieces.push('<path class="graph-edge '+(edge.kind==='produce'?'event':'consume')+'" data-edge-id="'+esc(edge.key)+'" marker-end="url(#'+markerId+')" d="'+path+'"/>')
        });

        Object.keys(nodes).forEach(key=>{const p=positions[key];if(p)pieces.push(nodeBox(nodes[key],p.x,p.y))});
        
        const fallback=state.selectedGraphNode||nodeKey('aggregate',aggs[0]?.aggregateId||'');
        const height=Math.max(560,top+ctxIds.length*rowH+60);
        return '<div class="domain-graph"><div class="graph-scroll"><svg viewBox="0 0 '+dynamicWidth+' '+height+'" width="'+dynamicWidth+'" height="'+height+'" preserveAspectRatio="xMinYMin meet" role="img" aria-label="'+esc(t('globalDomainAtlas'))+'">'+pieces.join('')+'</svg></div><div class="graph-detail stack"><h3>'+esc(t('graphDetail'))+'</h3>'+atlasDetail(dm,fallback)+'</div></div>'
      }
      function atlasDetail(dm,fallbackKey){const found=findGraphNode(dm,state.selectedGraphNode||fallbackKey);if(found.type==='context'&&found.item)return contextInspector(dm,found.item,true);if(found.type==='aggregate'&&found.item)return graphDetail(dm,nodeKey('aggregate',found.item.aggregateId))+'<button class="option-button" data-open-context="'+esc(found.item.contextId)+'"><strong>'+esc(t('openDrilldown'))+'</strong><p class="mini">'+esc(t('openDrilldownHint'))+'</p></button>';return graphDetail(dm,fallbackKey)}
      function domainGraph(dm,ctx){
        const id=ctx.contextId;const aggs=arr(dm.aggregates).filter(a=>a.contextId===id);const aggregateIds=new Set(aggs.map(a=>a.aggregateId));
        const allEvents=arr(dm.domainEvents).filter(e=>aggregateIds.has(e.producerAggregateId)||[...consumersForEvent(dm,e)].some(x=>aggregateIds.has(x)));
        const colW=250, left=34, top=26, aggW=210, objectH=23, rowH=54;
        const maxObjects=Math.max(1,...aggs.map(a=>arr(a.domainObjects).length));
        const aggH=82+maxObjects*objectH;const routeTop=top+aggH+46;
        const routeEvents=allEvents.length?allEvents:[{eventId:'no_events',name:t('events'),producerAggregateId:null,consumedByAggregateIds:[]}];
        const width=Math.max(820,left*2+aggs.length*colW);const height=Math.max(390,routeTop+routeEvents.length*rowH+34);
        const nodeMap={};const pieces=[];const lanes=[];const colLines=[];
        aggs.forEach((a,i)=>{const x=left+i*colW;colLines.push('<line class="graph-grid-line" x1="'+(x+aggW/2)+'" y1="'+(top+aggH+12)+'" x2="'+(x+aggW/2)+'" y2="'+(height-18)+'"/>')});
        aggs.forEach((a,i)=>{const x=left+i*colW,y=top;const key=nodeKey('aggregate',a.aggregateId);nodeMap[key]={x,y,w:aggW,h:aggH};
          let inner='';arr(a.domainObjects).forEach((o,j)=>{const kind=o.objectType==='value_object'?'value':'entity';const oy=y+58+j*objectH;const ok=nodeKey(kind,o.objectId);nodeMap[ok]={x:x+14,y:oy,w:aggW-28,h:18};inner+='<g class="graph-node '+(state.selectedGraphNode===ok?'active':'')+'" data-node-id="'+esc(ok)+'" tabindex="0"><rect x="'+(x+14)+'" y="'+oy+'" width="'+(aggW-28)+'" height="18" rx="6" fill="'+(kind==='value'?'#fff4dc':'#edf5fc')+'"></rect><text class="sub" x="'+(x+23)+'" y="'+(oy+13)+'">'+esc(loc(o.name)||o.objectId)+' · '+esc(o.objectType)+'</text></g>'});
          pieces.push('<g class="graph-node '+(state.selectedGraphNode===key?'active':'')+'" data-node-id="'+esc(key)+'" tabindex="0"><rect x="'+x+'" y="'+y+'" width="'+aggW+'" height="'+aggH+'" rx="12" fill="#edf7ef"></rect><text x="'+(x+14)+'" y="'+(y+24)+'">'+esc(loc(a.name)||a.aggregateId)+'</text><text class="sub" x="'+(x+14)+'" y="'+(y+42)+'">'+esc(a.aggregateRoot||a.aggregateId)+'</text></g>'+inner);
        });
        routeEvents.forEach((e,j)=>{const y=routeTop+j*rowH;const consumers=consumersForEvent(dm,e);lanes.push('<rect class="graph-lane" x="'+(left-10)+'" y="'+(y-20)+'" width="'+(width-left*2+20)+'" height="'+(rowH-10)+'" rx="9"/>');aggs.forEach((a,i)=>{const x=left+i*colW;const isSource=e.producerAggregateId===a.aggregateId;const isTarget=consumers.has(a.aggregateId);if(!isSource&&!isTarget)return;const ek=nodeKey('event',e.eventId);const fill=isSource?'#fff0ed':'#edf5fc';const label=isSource?(loc(e.name)||e.eventId):t('consumes');pieces.push('<g class="graph-node '+(state.selectedGraphNode===ek?'active':'')+'" data-node-id="'+esc(ek)+'" tabindex="0"><rect x="'+(x+8)+'" y="'+(y-10)+'" width="'+(aggW-16)+'" height="26" rx="9" fill="'+fill+'"></rect><text x="'+(x+17)+'" y="'+(y+2)+'">'+esc(label)+'</text><text class="sub" x="'+(x+17)+'" y="'+(y+14)+'">'+esc(isSource?e.eventId:t('viaEvent')+' '+e.eventId)+'</text></g>')})});
        const first=aggs[0]&&nodeKey('aggregate',aggs[0].aggregateId);return '<div class="domain-graph"><svg viewBox="0 0 '+width+' '+height+'" role="img" aria-label="'+esc(t('domainGraph'))+'">'+colLines.join('')+lanes.join('')+pieces.join('')+'</svg><div class="graph-detail stack"><h3>'+esc(t('graphDetail'))+'</h3>'+graphDetail(dm,state.selectedGraphNode||first)+'</div></div>'
      }
      function domainObjectCards(items){return arr(items).map(o=>{const rel=o.aggregateRelationship||{};return smallCard(loc(o.name)||o.objectId,chip(t('id'),o.objectId)+chip(t('type'),o.objectType)+chip(t('aggregate'),o.aggregateId)+chip(t('identityPolicy'),o.identityPolicy)+para(o.description)+(arr(o.equalityBy).length?'<h3>'+esc(t('equalityBy'))+'</h3>'+list(o.equalityBy,t('noItems')):'')+'<h3>'+esc(t('relationship'))+'</h3>'+chip(t('type'),rel.relationshipType)+chip(t('cardinality'),rel.cardinality)+chip(t('consistency'),rel.consistency)+para(rel.rationale),'info')}).join('')||'<div class="empty">'+esc(t('noItems'))+'</div>'}
      function objectRelationshipCards(items){return arr(items).map(r=>smallCard(r.relationshipId||r.objectId,chip(t('aggregate'),r.aggregateId)+chip(t('root'),r.aggregateRoot)+chip(t('id'),r.objectId)+chip(t('type'),r.objectType||r.relationshipType)+chip(t('cardinality'),r.cardinality)+chip(t('consistency'),r.consistency)+para(r.rationale),'info')).join('')||'<div class="empty">'+esc(t('noRelationships'))+'</div>'}
      function aggregateRelationshipRows(items){const rows=arr(items).map(r=>'<div class="relationship-row"><div>'+esc(r.relationshipType||r.relationshipId||'')+'<br>'+esc(r.relationshipScope||'')+'</div><div>'+esc(r.sourceAggregateRoot||r.sourceAggregateId||'')+'<br>'+esc(r.sourceContextId||'')+'</div><div class="arrow">via events<br>'+esc(arr(r.viaEvents).join(', '))+'<br>to '+esc(r.targetAggregateRoot||r.targetAggregateId||r.targetReadModel||'')+' · '+esc(r.targetContextId||'')+'</div><div>'+esc(loc(r.description)||'')+'<br>'+esc(r.consistency||'')+'</div></div>').join('');return '<div class="relationship-list"><div class="relationship-row head"><div>'+esc(t('type'))+'</div><div>'+esc(t('source'))+'</div><div>'+esc(t('target'))+'</div><div>'+esc(t('description'))+'</div></div>'+(rows||'<div class="empty">'+esc(t('noRelationships'))+'</div>')+'</div>'}
      function commandCards(items){return arr(items).map(c=>smallCard(loc(c.name)||c.commandId,chip(t('id'),c.commandId)+chip(t('actor'),c.actor)+chip(t('target'),c.targetAggregateId)+para(c.intent)+'<h3>'+esc(t('preconditions'))+'</h3>'+list(c.preconditions,t('noItems'))+'<h3>'+esc(t('businessRules'))+'</h3>'+list(c.businessRules,t('noItems'))+list(c.emits||c.triggeredEventIds,t('noItems')),'ok')).join('')||'<div class="empty">'+esc(t('noItems'))+'</div>'}
      function eventCards(items){return arr(items).map(e=>smallCard(loc(e.name)||e.eventId,chip(t('id'),e.eventId)+chip(t('owner'),e.owningContextId||e.contextId)+chip(t('aggregate'),e.producerAggregateId)+chip(t('payload'),e.payloadSummary)+para(e.meaning)+'<h3>'+esc(t('consumes'))+'</h3>'+list([...consumersForEvent((state.data&&state.data.domainModel)||state.data||{},e)],t('noItems'))+list(e.consumers||e.consumedByContextIds,t('noItems'))+list(e.sourceRefs,t('noItems')),'warn')).join('')||'<div class="empty">'+esc(t('noItems'))+'</div>'}
      function capabilityMappingCards(items){return arr(items).map(m=>{const modules=arr(m.moduleRefs);const sources=arr(m.sourceRefs);return smallCard(m.capabilityRef||m.capabilityId||t('capabilityMapping'),chip(t('context'),m.contextId)+chip(t('status'),m.mappingStatus)+chip(t('type'),m.mappingType)+para(m.rationale)+(modules.length?list(modules,t('noItems')):'')+(sources.length?list(sources,t('noItems')):''),'info')}).join('')||'<div class="empty">'+esc(t('noMappings'))+'</div>'}
      function relationshipRows(items){const rows=arr(items).map(r=>'<div class="relationship-row"><div>'+esc(loc(r.relationshipType)||r.relationshipId||t('relationship'))+'</div><div>'+esc(r.sourceContextId||r.fromContextId||'')+'</div><div class="arrow">→ '+esc(r.targetContextId||r.toContextId||'')+'</div><div>'+esc(loc(r.description)||arr(r.candidateContractRefs).concat(arr(r.eventRefs)).join(', '))+'</div></div>').join('');return '<div class="relationship-list"><div class="relationship-row head"><div>'+esc(t('type'))+'</div><div>'+esc(t('source'))+'</div><div>'+esc(t('target'))+'</div><div>'+esc(t('description'))+'</div></div>'+(rows||'<div class="empty">'+esc(t('noRelationships'))+'</div>')+'</div>'}
      function qualityGate(q){if(!q)return '<div class="empty">'+esc(t('noItems'))+'</div>';const score=Number(q.score||q.readinessScore||0);const status=q.status||q.result||(score>=80?'pass':score?'review':'unknown');const findings=arr(q.findings||q.checks||q.openFindings).map(finding).join('');return '<div class="stack"><div>'+pill(status,status==='pass'||status==='passed'?'ok':status==='fail'||status==='failed'?'risk':'warn')+'</div>'+(score?'<div class="quality-score">'+esc(score)+'</div><div class="meter" style="--w:'+Math.max(0,Math.min(100,score))+'%"><span></span></div>':'')+para(q.summary||q.rationale)+findings+'</div>'}
      function auditTrace(d){const decision=d.decisionTrace||{};const answers=arr(decision.clarificationAnswers).map(a=>smallCard(a.questionId||t('answer'),chip(t('answer'),a.answer)+chip(t('id'),a.selectedOptionId)+para(a.rationale)+para(a.resultingChange),'ok')).join('');return '<div class="trace"><article class="trace-item"><h3>'+esc(t('decisionTrace'))+'</h3>'+chip(t('id'),decision.selectedOptionId)+chip(t('owner'),decision.reviewer)+chip(t('status'),decision.reviewedAt)+para(decision.rationale)+para(decision.synthesisNarrative)+'</article><article class="trace-item"><h3>'+esc(t('evidence'))+'</h3>'+list(d.evidenceRefs,t('noItems'))+'</article><article class="trace-item"><h3>'+esc(t('assumptions'))+'</h3>'+list(d.assumptions,t('noItems'))+'</article></div>'+(answers?'<div class="stack">'+answers+'</div>':'')}
      function finding(f){if(!f)return'';const sev=lower(f.severity||f.status);const cls=sev.includes('block')||sev.includes('high')||sev.includes('fail')?'blocking':sev.includes('warn')||sev.includes('medium')?'warn':'info';return smallCard(f.findingId||f.checkId||f.status||t('finding'),chip(t('severity'),f.severity||f.status)+para(f.summary||f.statement||f.message||f)+para(f.impact)+para(f.mitigation),cls)}      function wire(){
        root.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{state.lang=b.dataset.lang;render(state.data)});
        root.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;if(state.view==='workbook'&&String(state.selectedGraphNode||'').startsWith('context:'))state.selectedGraphNode=null;render(state.data)});
        root.querySelectorAll('[data-context]').forEach(b=>b.onclick=()=>{state.selectedContext=b.dataset.context;state.selectedGraphNode=nodeKey('context',b.dataset.context);render(state.data)});
        root.querySelectorAll('[data-open-context]').forEach(b=>b.onclick=()=>{state.selectedContext=b.dataset.openContext;state.selectedGraphNode=null;state.view='workbook';render(state.data)});
        root.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{state.selectedOption=b.dataset.option;state.selectedGraphNode=null;render(state.data)});
        root.querySelectorAll('[data-exp-tab]').forEach(b=>b.onclick=()=>{state.explorationTab=b.dataset.expTab;render(state.data)});
        root.querySelectorAll('.graph-node[data-hover-nodes]').forEach(node=>{
          node.onmouseenter=()=>setGraphHover(node.dataset.hoverNodes,node.dataset.hoverEdges);
          node.onmouseleave=clearGraphHover;
        });
        root.querySelectorAll('[data-node-id]').forEach(b=>b.onclick=()=>{state.selectedGraphNode=b.dataset.nodeId;const found=findGraphNode((state.data&&state.data.domainModel)||state.data||{},state.selectedGraphNode);if(found.item&&found.type==='context')state.selectedContext=found.item.contextId;if(found.item&&found.type==='aggregate')state.selectedContext=found.item.contextId;if(found.item&&found.type==='event')state.selectedContext=found.item.owningContextId||found.item.contextId||state.selectedContext;render(state.data)});
      }
      function setGraphHover(nodeList,edgeList){
        const nodes=new Set(String(nodeList||'').split(/\s+/).filter(Boolean));const edges=new Set(String(edgeList||'').split(/\s+/).filter(Boolean));
        root.querySelectorAll('.graph-node[data-node-id]').forEach(n=>{const on=nodes.has(n.dataset.nodeId);n.classList.toggle('flow-active',on);n.classList.toggle('flow-dim',nodes.size>0&&!on)});
        root.querySelectorAll('.graph-edge[data-edge-id]').forEach(e=>{const on=edges.has(e.dataset.edgeId);e.classList.toggle('flow-active',on);e.classList.toggle('flow-dim',edges.size>0&&!on)});
      }
      function clearGraphHover(){
        root.querySelectorAll('.flow-active,.flow-dim').forEach(el=>el.classList.remove('flow-active','flow-dim'));
      }
      function showError(err){root.innerHTML='<div class="error"><strong>'+esc(t('rendererError'))+'</strong><br>'+esc(err&&err.message?err.message:err)+'</div>'}
      const demoFiles={raw:['demo-domain-design-raw.json','../demo-domain-design-raw.json'],exploration:['demo-domain-design-exploration.json','../demo-domain-design-exploration.json'],current:['demo-domain-design-current.json','demo-domain-design.json','../demo-domain-design-current.json','../demo-domain-design.json']};
      async function loadDemoFromQuery(){const params=new URLSearchParams(window.location&&window.location.search||'');const mode=params.get('demo');if(!mode)return false;const paths=demoFiles[mode];if(!paths)throw new Error(t('unknownDemoMode')+': '+mode);let lastError=null;for(const path of paths){try{const response=await fetch(path);if(!response.ok){lastError=new Error(t('demoLoadFailed')+': '+path+' · '+response.status);continue}render(parse(await response.text()));return true}catch(err){lastError=err}}throw lastError||new Error(t('unableToLoadDemo')+': '+mode)}
      window.addEventListener('message',ev=>{if(!ev.data||ev.data.type!=='acas-render-resource')return;try{render(parse(ev.data))}catch(err){showError(err)}});
      async function init(){try{if(window.__ACAS_RENDER_RESOURCE__){render(parse(window.__ACAS_RENDER_RESOURCE__));return}await loadDemoFromQuery()}catch(err){showError(err)}}
      init()
    })();
  </script>
