<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACAS Glossary Renderer</title>
  <style>
    :root{--bg:#f7f5f2;--panel:#fffdfa;--glass:rgba(255,253,250,.82);--ink:#1a1c1e;--muted:#6c7278;--line:#ddd6cc;--accent:#b8422e;--green:#1f6b57;--blue:#2f5f8f;--gold:#a66a00;--soft:#fbf8f3;--shadow:0 18px 42px rgba(26,28,30,.08);font-family:Inter,"Public Sans",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% -10%,#fffdfa 0,#f7f5f2 38%,#efe8dd 100%);color:var(--ink)}main{min-width:390px;padding:24px}h1,h2,h3,p{margin:0;letter-spacing:0}h1{font-size:24px;line-height:1.2;font-weight:760}h2{font-size:14px;font-weight:760}h3{font-size:13px;font-weight:760}.shell{display:grid;gap:16px;width:min(86vw,1920px);margin:0 auto}.panel,.card{background:var(--glass);border:1px solid rgba(221,214,204,.86);border-radius:8px;box-shadow:var(--shadow);backdrop-filter:blur(18px)}.top{padding:18px 22px;display:grid;gap:12px}.bar{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.summary{max-width:900px;color:var(--muted);font-size:13px;line-height:1.45;margin-top:5px}.chips,.tabs,.meta{display:flex;flex-wrap:wrap;gap:8px}.chip{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.62);color:var(--muted);padding:5px 10px;font-size:12px}.chip.ok{border-color:#bdd8c9;color:var(--green);background:#f4fbf6}.chip.warn{border-color:#efd59a;color:#775000;background:#fff8df}.chip.bad{border-color:#efc3ba;color:var(--accent);background:#fff5f2}.tab{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;color:var(--muted);cursor:pointer;font:inherit}.tab.active{background:var(--ink);border-color:var(--ink);color:#fff}.grid{display:grid;grid-template-columns:280px minmax(0,1fr) 340px;gap:16px;align-items:start}.grid.two{grid-template-columns:1fr 360px}.card{padding:14px;display:grid;gap:10px;min-width:0}.stack{display:grid;gap:10px}.term-list{display:grid;gap:8px;max-height:72vh;overflow:auto}.term-btn{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.68);padding:10px;text-align:left;cursor:pointer;color:var(--ink);display:grid;gap:5px}.term-btn.active{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green);background:#f8fffa}.term-btn strong{font-size:13px}.term-btn span,.small{font-size:12px;color:var(--muted);line-height:1.35}.term-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.def{font-size:15px;line-height:1.55;border-left:4px solid var(--green);padding:8px 12px;background:#f6fbf7}.kv{display:grid;grid-template-columns:140px minmax(0,1fr);border-top:1px solid var(--line)}.kv div{padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}.kv div:nth-child(odd){background:var(--soft);color:var(--muted)}.table{display:grid;overflow:auto;border:1px solid var(--line);border-radius:8px}.row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr}.row.wide{grid-template-columns:1fr 1.2fr 1.2fr 1.2fr}.row>div{padding:10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;line-height:1.38;min-width:0;overflow-wrap:anywhere}.row.head>div{font-weight:760;background:#efe8dd;color:#3d454d}.alias{display:grid;grid-template-columns:90px minmax(0,1fr);gap:7px;align-items:start}.alias strong{font-size:12px}.alias p{font-size:12px;color:var(--muted);line-height:1.36}.cluster{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:11px;background:#fff8f5;display:grid;gap:7px}.option{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px;background:#f8fbff;display:grid;gap:8px}.option.recommended{border-left-color:var(--green);background:#f6fbf7}.question{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;padding:12px;background:#fffaf0;display:grid;gap:8px}.finding{border:1px solid var(--line);border-radius:8px;padding:9px;background:rgba(255,255,255,.7);display:grid;gap:4px}.finding.error,.finding.blocking{border-left:4px solid var(--accent)}.finding.warning{border-left:4px solid var(--gold)}.finding.info{border-left:4px solid var(--blue)}ul{margin:0;padding-left:18px}li{font-size:12px;line-height:1.36;margin:2px 0}.empty,.waiting,.error{border:1px dashed var(--line);border-radius:8px;background:var(--panel);color:var(--muted);padding:16px}.error{border-color:#edbbbb;color:#933}@media(max-width:1100px){main{padding:12px}.grid,.grid.two{grid-template-columns:1fr}.shell{width:100%}.term-list{max-height:none}.row,.row.wide{grid-template-columns:minmax(160px,1fr)}} 
  </style>
</head>
<body>
  <main id="root"><div class="waiting">Waiting for ACAS Glossary data...</div></main>
  <script>
    (function(){
      const root=document.getElementById('root');let state={data:null,selected:null,tab:'current'};
      const tr={raw:'Raw 术语',exploration:'术语对齐评审',current:'当前术语表',terms:'术语',sources:'来源',ambiguity:'歧义',readiness:'就绪度',clusters:'冲突簇',options:'命名方案',questions:'评审问题',aliases:'别名',contexts:'上下文含义',alignment:'对齐矩阵',quality:'质量门',risks:'开放风险',accepted:'可接受',discouraged:'不鼓励',forbidden:'禁用'};
      function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
      function loc(v){return v&&typeof v==='object'&&!Array.isArray(v)?JSON.stringify(v):v}
      function arr(v){return Array.isArray(v)?v.filter(x=>x!=null&&x!==''):(v==null||v===''?[]:[v])}
      function parse(input){const r=input&&input.resource?input.resource:input;const raw=r&&typeof r.content==='string'?r.content:r;if(typeof raw==='string')return JSON.parse(raw);if(raw&&typeof raw==='object')return raw;return demo(new URLSearchParams(location.search).get('demo')||'current')}
      function chip(v,kind=''){return'<span class="chip '+kind+'">'+esc(loc(v))+'</span>'}
      function list(v){const a=arr(v).map(loc).filter(Boolean);return a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<span class="small">-</span>'}
      function card(t,b){return'<section class="card"><h2>'+esc(t)+'</h2>'+b+'</section>'}
      function kv(o){return'<div class="kv">'+Object.entries(o||{}).map(([k,v])=>'<div>'+esc(k)+'</div><div>'+esc(loc(v))+'</div>').join('')+'</div>'}
      function shell(title,summary,body,meta=''){return'<div class="shell"><section class="panel top"><div class="bar"><div><h1>'+esc(loc(title))+'</h1><p class="summary">'+esc(loc(summary))+'</p></div><div class="tabs"><button class="tab active">'+esc(layerLabel(state.data))+'</button></div></div><div class="meta">'+meta+'</div></section>'+body+'</div>'}
      function layerLabel(d){if(!d)return'Glossary';return d.layer==='Raw'?tr.raw:d.layer==='Exploration'?tr.exploration:tr.current}
      function rawView(d){const sources=arr(d.sourceArtifacts).map(s=>card(s.artifactType+' · '+s.layer,kv({ref:s.artifactRef,scope:s.extractionScope,summary:s.sourceSummary}))).join('');const terms=arr(d.termCandidates).map(t=>'<div class="term-btn"><strong>'+esc(loc(t.observedTerm))+'</strong><span>'+esc(t.usageType||'')+'</span><span>'+esc(loc(t.meaningHint)||'')+'</span><div class="chips">'+arr(t.observedIn).map(x=>chip(x)).join('')+'</div></div>').join('');const signals=arr(d.ambiguitySignals).map(s=>'<div class="cluster"><h3>'+esc(loc(s.summary))+'</h3><div class="chips">'+chip(s.severity,s.severity==='blocking'?'bad':'warn')+arr(s.candidateIds).map(x=>chip(x)).join('')+'</div><p class="small">'+esc(loc(s.downstreamRisk)||'')+'</p></div>').join('');const body='<section class="grid"><aside class="stack">'+card(tr.sources,sources)+card(tr.readiness,kv(d.readinessGate||{}))+'</aside>'+card(tr.terms,'<div class="term-list">'+terms+'</div>')+'<aside class="stack">'+card(tr.ambiguity,signals||'<div class="empty">暂无歧义信号。</div>')+'</aside></section>';return shell('Glossary Raw','在选择核心术语前保留来源词汇。',body,chip(d.kind)+chip(d.layer))}
      function explorationView(d){const clusters=arr(d.conflictClusters).map(c=>'<div class="cluster"><h3>'+esc(loc(c.title))+'</h3>'+list(c.candidateTerms)+'<p class="small">'+esc(loc(c.risk)||'')+'</p><div class="chips">'+arr(c.affectedArtifacts).map(x=>chip(x)).join('')+'</div></div>').join('');const opts=arr(d.namingOptions).map(o=>'<div class="option '+(o.optionId===d.recommendedOptionId?'recommended':'')+'"><div class="term-head"><h2>'+esc(loc(o.title))+'</h2>'+chip(o.optionId===d.recommendedOptionId?'推荐':o.optionId,o.optionId===d.recommendedOptionId?'ok':'')+'</div><p class="small">'+esc(loc(o.summary))+'</p>'+policyTable(o.termPolicies)+card('取舍',list(o.tradeoffs))+card('下游影响',list(o.downstreamImpact))+'</div>').join('');const qs=arr(d.clarificationQuestions).map(q=>'<div class="question"><h3>'+esc(loc(q.question))+'</h3><p class="small">'+esc(loc(q.whyItMatters)||'')+'</p><div class="chips">'+chip(q.questionId)+chip(q.recommendedOptionId||'')+'</div></div>').join('');const body='<section class="grid"><aside class="stack">'+card(tr.clusters,clusters)+card('范围',kv(d.inferredScope||{}))+'</aside>'+card(tr.options,'<div class="stack">'+opts+'</div>')+'<aside class="stack">'+card(tr.questions,qs)+card(tr.risks,list(d.openRisks))+'</aside></section>';return shell('Glossary Exploration',d.recommendationReason||'评审前比较术语策略。',body,chip(d.kind)+chip(d.layer)+chip('推荐 '+d.recommendedOptionId,'ok'))}
      function policyTable(items){const rows=arr(items).map(p=>'<div class="row wide"><div>'+esc(p.termId)+'</div><div>'+esc(loc(p.canonicalTerm))+'</div><div>'+esc(loc(p.policy))+'</div><div>'+esc(arr(p.forbiddenAliases).map(loc).join(', '))+'</div></div>').join('');return'<div class="table"><div class="row wide head"><div>术语 ID</div><div>核心术语</div><div>策略</div><div>禁用别名</div></div>'+rows+'</div>'}
      function currentView(d){const terms=arr(d.glossary&&d.glossary.terms);const selected=terms.find(t=>t.termId===state.selected)||terms[0]||{};state.selected=selected.termId;const listHtml=terms.map(t=>'<button class="term-btn '+(t.termId===selected.termId?'active':'')+'" data-term="'+esc(t.termId)+'"><strong>'+esc(loc(t.canonicalTerm))+'</strong><span>'+esc(t.termId)+'</span><span>'+esc(loc(t.definition))+'</span></button>').join('');const detail='<div class="term-head"><div><h2>'+esc(loc(selected.canonicalTerm)||'术语')+'</h2><p class="def">'+esc(loc(selected.definition)||'')+'</p></div>'+chip(selected.status,selected.status==='approved'?'ok':'warn')+'</div>'+kv({termId:selected.termId,userFacingTerm:selected.userFacingTerm,domainTerm:selected.domainTerm,contractTerm:selected.contractTerm,codeTerm:selected.codeTerm,ownerArtifact:selected.ownerArtifact,confidence:selected.confidence})+aliasBlock(selected.aliases)+contextBlock(selected.contextMeanings);const body='<section class="grid"><aside>'+card(tr.terms,'<div class="term-list">'+listHtml+'</div>')+'</aside><main class="stack">'+card('术语详情',detail)+card(tr.alignment,alignment(d.alignmentMatrix))+'</main><aside class="stack">'+card(tr.quality,quality(d.qualityGate))+card(tr.risks,findings(d.openRisks))+'</aside></section>';return shell('Glossary Current',loc(d.glossary&&d.glossary.scope&&d.glossary.scope.scenario)||'已审共享术语表。',body,chip(d.kind)+chip(d.layer)+chip(d.qualityGate&&d.qualityGate.status,d.qualityGate&&d.qualityGate.status==='pass'?'ok':'warn'))}
      function aliasBlock(a){return'<h3>'+tr.aliases+'</h3><div class="stack">'+['accepted','discouraged','forbidden'].map(k=>'<div class="alias"><strong>'+tr[k]+'</strong><p>'+esc(arr(a&&a[k]).map(loc).join(', ')||'-')+'</p></div>').join('')+'</div>'}
      function contextBlock(items){return'<h3>'+tr.contexts+'</h3><div class="stack">'+arr(items).map(c=>'<div class="finding info"><strong>'+esc(c.contextId)+'</strong><p class="small">'+esc(loc(c.meaning))+'</p></div>').join('')+'</div>'}
      function alignment(items){const rows=arr(items).map(r=>'<div class="row"><div>'+esc(r.termId)+'</div><div>'+esc(loc(r.journey))+'</div><div>'+esc(loc(r.domain))+'</div><div>'+esc(loc(r.ui))+'</div><div>'+esc(loc(r.contract))+'</div></div>').join('');return'<div class="table"><div class="row head"><div>术语</div><div>旅程</div><div>领域</div><div>UI</div><div>契约</div></div>'+rows+'</div>'}
      function findings(items){const rows=arr(items).map(f=>'<div class="finding '+esc(f.severity||'info')+'"><strong>'+esc(f.findingId||f.severity||'finding')+'</strong><p class="small">'+esc(loc(f.message)||loc(f))+'</p></div>').join('');return rows||'<div class="empty">No findings.</div>'}
      function quality(q){return'<div class="chips">'+chip(q&&q.status,q&&q.status==='pass'?'ok':'warn')+'</div>'+findings(q&&q.checks)}
      function render(data){state.data=data;try{root.innerHTML=data.layer==='Raw'?rawView(data):data.layer==='Exploration'?explorationView(data):currentView(data);root.querySelectorAll('[data-term]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.term;render(state.data)})}catch(e){root.innerHTML='<div class="error">Glossary renderer 错误：'+esc(e.message)+'</div>'}}
      function demo(mode){if(mode==='raw')return{kind:'GlossaryRaw',layer:'Raw',sourceArtifacts:[{artifactRef:'artifact:user-journey/current.yaml',artifactType:'用户旅程',layer:'Current',extractionScope:'用户角色、场景、目标和主要术语',sourceSummary:'客户门户用户提交并追踪支持请求。'},{artifactRef:'artifact:flow-model/current.yaml',artifactType:'流程模型',layer:'Current',extractionScope:'节点、事件和状态词',sourceSummary:'流程包含提交支持请求、请求证据和追踪状态。'}],termCandidates:[{candidateId:'tc_issue',observedTerm:'问题',observedIn:['用户旅程','流程模型'],usageType:'user_language',meaningHint:'客户希望解决的问题。',sourceRefs:['journey#goal']},{candidateId:'tc_ticket',observedTerm:'工单',observedIn:['原型'],usageType:'ui_label',meaningHint:'内部支持系统说法。',sourceRefs:['prototype#status']},{candidateId:'tc_case',observedTerm:'案件',observedIn:['领域'],usageType:'domain_term',meaningHint:'内部运营记录。',sourceRefs:['domain#objects']}],ambiguitySignals:[{signalId:'as_issue_ticket_case',summary:'问题、工单和案件正在跨产物漂移。',candidateIds:['tc_issue','tc_ticket','tc_case'],severity:'high',downstreamRisk:'领域、界面和契约可能编码成不同对象。'}],readinessGate:{status:'ready',reason:'已有足够跨产物术语信号。'}};if(mode==='exploration')return{kind:'GlossaryExploration',layer:'Exploration',rawArtifactRef:'runs/demo/glossary/raw.yaml',inferredScope:{productArea:'客户支持门户',scenario:'提交并追踪支持请求',languages:['中文'],downstreamArtifacts:['流程模型','领域设计','界面规范','交互契约'],glossaryMode:'reconciliation_gate'},conflictClusters:[{clusterId:'issue_ticket_case',title:'问题 / 工单 / 案件边界',candidateTerms:['问题','工单','案件','支持请求'],risk:'同一概念族跨越用户语言、领域对象和界面标签。',affectedArtifacts:['领域设计','界面规范','交互契约']}],recommendedOptionId:'split_user_domain_internal',recommendationReason:'保留用户语言，同时防止内部“案件”泄漏。',namingOptions:[{optionId:'split_user_domain_internal',title:'拆分用户语言、领域语言和内部语言',summary:'用户界面使用“支持请求”，并禁止客户可见界面使用“案件”。',termPolicies:[{termId:'support_issue',canonicalTerm:'支持请求',policy:'已审定核心术语；界面展示“支持请求”。',acceptedAliases:['问题','支持问题'],forbiddenAliases:['案件']}],tradeoffs:['需要维护显式映射。'],downstreamImpact:['领域和界面可以引用同一个术语标识。'],evidenceRefs:['journey#goal','domain#objects']},{optionId:'use_ticket_everywhere',title:'全链路统一使用“工单”',summary:'把问题、工单和案件合并成一个共享标签。',termPolicies:[{termId:'ticket',canonicalTerm:'工单',policy:'因偏内部语言而不推荐。',forbiddenAliases:['案件']}],tradeoffs:['更简单但不够用户中心。'],downstreamImpact:['可能污染用户旅程和界面语言。']}],clarificationQuestions:[{questionId:'q_case_alias',question:'是否禁止在客户可见界面中使用“案件”？',whyItMatters:'这会影响界面规范和契约措辞。',answerType:'single_choice',options:[],recommendedOptionId:'forbid_case'}],openRisks:['负责人和服务等级承诺展示词仍需策略评审。']};return{kind:'GlossaryCurrent',layer:'Current',explorationArtifactRef:'runs/demo/glossary/exploration.yaml',glossary:{glossaryId:'support_issue_shared_vocabulary',scope:{productArea:'客户支持门户',scenario:'提交并追踪支持请求',languagePolicy:'展示数据统一使用中文；机器标识只作为引用。',sourceRefs:['journey/current.yaml','flow/current.yaml','capability/current.yaml']},terms:[{termId:'support_issue',canonicalTerm:'支持请求',userFacingTerm:'支持请求',domainTerm:'支持请求领域对象',contractTerm:'支持请求契约字段',codeTerm:'支持请求代码标识',definition:'客户提交并追踪的、需要产品或支持团队响应的问题记录。',contextMeanings:[{contextId:'user_journey',meaning:'客户希望解决的问题。'},{contextId:'domain_support',meaning:'具有身份、状态、证据和解决生命周期的领域对象。'}],aliases:{accepted:['问题','支持问题'],discouraged:['工单'],forbidden:['案件']},relatedTerms:{narrower:['evidence_package','status_update','resolution']},ownerArtifact:'domain-design',status:'approved',confidence:'high',sourceRefs:['journey#goal','flow#submit_issue'],reviewTrace:{decisionRef:'decision:glossary-support-issue'}},{termId:'evidence_package',canonicalTerm:'问题证据',userFacingTerm:'问题证据',domainTerm:'问题证据领域对象',contractTerm:'问题证据契约字段',definition:'用于分类或解决支持请求的一组文件、文字说明、截图、日志和引用。',contextMeanings:[{contextId:'prototype',meaning:'用户可见的上传区域和检查清单。'},{contextId:'domain_support',meaning:'支持请求拥有的证据对象。'}],aliases:{accepted:['证据','问题证据'],discouraged:['附件'],forbidden:[]},ownerArtifact:'domain-design',status:'approved',confidence:'medium',sourceRefs:['prototype#evidence','flow#request_evidence']} ]},alignmentMatrix:[{termId:'support_issue',journey:'问题 / 支持问题',flow:'提交支持请求',domain:'支持请求领域对象',ui:'支持请求',contract:'支持请求契约字段',agentPrompt:'使用 support_issue 这个术语标识。'},{termId:'evidence_package',journey:'需要证据',flow:'请求补充证据',domain:'问题证据领域对象',ui:'问题证据',contract:'问题证据契约字段'}],decisionTrace:{selectedOptionId:'split_user_domain_internal',rationale:'保留用户语言并隔离内部案件说法。',reviewer:'acas_operator'},qualityGate:{status:'pass',checks:[{findingId:'qg_source_refs',severity:'info',message:'已审术语都有来源引用。'},{findingId:'qg_forbidden_aliases',severity:'info',message:'“案件”禁止用于客户可见界面。',termIds:['support_issue']}]},openRisks:[{findingId:'risk_sla_owner',severity:'warning',message:'负责人和服务等级承诺展示词仍需策略评审。'}],evidenceRefs:['journey#goal','flow#submit_issue']}}
      window.addEventListener('message',ev=>{try{render(parse(ev.data))}catch(e){root.innerHTML='<div class="error">'+esc(e.message)+'</div>'}});render(demo(new URLSearchParams(location.search).get('demo')||'current'));
    })();
  </script>
</body>
</html>
